<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mac Hotels - Order</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system, "Helvetica Neue", Arial, sans-serif; background:#F4F7F9; color:#12314A; padding-bottom:90px; }
.hero { background:#0E3A5D; color:#FFFFFF; padding:22px 18px 18px 18px; }
.hero h1 { font-size:20px; letter-spacing:2px; text-transform:uppercase; font-weight:700; }
.hero .sub { font-size:13px; color:#9CC8E0; margin-top:4px; letter-spacing:1px; }
.tablebadge { display:inline-block; background:#2E9CCA; color:#FFFFFF; font-weight:700; border-radius:20px; padding:6px 14px; margin-top:12px; font-size:15px; }
.catnav { position:-webkit-sticky; position:sticky; top:0; background:#0E3A5D; overflow-x:auto; white-space:nowrap; padding:10px 12px; z-index:5; -webkit-overflow-scrolling:touch; }
.catnav a { display:inline-block; color:#9CC8E0; text-decoration:none; font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; padding:6px 10px; border-radius:16px; }
.catnav a.on { background:#2E9CCA; color:#FFFFFF; }
.cat { padding:18px 14px 4px 14px; }
.cat h2 { font-size:14px; letter-spacing:2px; text-transform:uppercase; color:#2E9CCA; border-bottom:2px solid #2E9CCA; padding-bottom:6px; margin-bottom:10px; font-weight:700; }
.item { background:#FFFFFF; border-radius:12px; box-shadow:0 1px 3px rgba(14,58,93,0.10); padding:12px 12px; margin-bottom:8px; display:table; width:100%; }
.item .info { display:table-cell; vertical-align:middle; }
.item .nm { font-size:15px; font-weight:600; }
.item .dt { font-size:12px; color:#7A93A6; margin-top:2px; }
.item .pr { font-size:14px; color:#0E3A5D; font-weight:700; margin-top:2px; }
.item .ctl { display:table-cell; vertical-align:middle; text-align:right; white-space:nowrap; width:110px; }
.btn { display:inline-block; width:36px; height:36px; line-height:34px; text-align:center; border-radius:50%; border:none; font-size:20px; font-weight:700; background:#E4EEF4; color:#0E3A5D; }
.btn.add { background:#2E9CCA; color:#FFFFFF; }
.qty { display:inline-block; min-width:26px; text-align:center; font-size:16px; font-weight:700; }
.hid { display:none; }
.bar { position:fixed; bottom:0; left:0; right:0; background:#0E3A5D; padding:12px 14px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); z-index:10; }
.bar button { width:100%; background:#E8B23A; color:#0E3A5D; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; letter-spacing:0.5px; }
.panel { position:fixed; top:0; left:0; right:0; bottom:0; background:#F4F7F9; z-index:20; overflow-y:auto; padding-bottom:120px; }
.panel .ph { background:#0E3A5D; color:#FFFFFF; padding:18px 14px; font-size:16px; font-weight:700; letter-spacing:1px; }
.panel .ph span { float:right; color:#9CC8E0; font-weight:400; font-size:14px; }
.lwrap { background:#FFFFFF; border-radius:12px; margin:8px 14px; padding:12px; box-shadow:0 1px 3px rgba(14,58,93,0.10); }
.line { display:table; width:100%; }
.line .li { display:table-cell; vertical-align:middle; }
.line .lc { display:table-cell; vertical-align:middle; text-align:right; white-space:nowrap; width:120px; }
.lnote { width:100%; margin-top:8px; border:1px solid #C9DAE5; border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; background:#F4F7F9; color:#12314A; }
.tot { margin:14px; padding:14px; background:#FFFFFF; border-radius:12px; font-size:17px; font-weight:700; box-shadow:0 1px 3px rgba(14,58,93,0.10); }
.tot span { float:right; }
.note { margin:0 14px; }
.note textarea { width:100%; border:1px solid #C9DAE5; border-radius:12px; padding:12px; font-size:15px; font-family:inherit; min-height:70px; background:#FFFFFF; }
.vat { text-align:center; color:#7A93A6; font-size:12px; margin:14px; }
.done { text-align:center; padding:70px 24px; }
.done .big { font-size:56px; }
.done h2 { font-size:22px; margin:14px 0 8px 0; color:#0E3A5D; }
.done p { color:#5B7489; font-size:15px; line-height:1.5; }
.tprompt { padding:26px 18px; }
.tprompt h2 { font-size:18px; color:#0E3A5D; margin-bottom:10px; }
.tprompt input { width:100%; padding:14px; font-size:18px; border:1px solid #C9DAE5; border-radius:12px; text-align:center; }
.tprompt button { width:100%; margin-top:12px; background:#2E9CCA; color:#FFFFFF; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; }
</style>
</head>

<div id="tprompt" class="tprompt hid">

<div id="menuwrap">

<div class="panel hid" id="panel">

  <div id="lines"></div>
  <div class="tot">Total <span id="ptotal"></span></div>
  <div class="note"><textarea id="onote" placeholder="Any notes for the bar? (ice, lemon, allergies...)"></textarea></div>
  <div class="bar"><button onclick="sendOrder()" id="sendbtn">Send order to the bar</button></div>
</div>

<div class="panel hid" id="donepanel">
  <div class="done">
    <div class="big">&#127866;</div>
    <h2 id="donehead">Order sent!</h2>
    <p>The bar has your order and will bring it to your table. Sit back and enjoy the marina.</p>
    <p style="margin-top:20px;"><a href="#" onclick="resetOrder(); return false;" style="color:#2E9CCA; font-weight:700;">Order something else</a></p>
  </div>
</div>

var basket = {};
var itemNotes = {};
var tableNo = "";

function euro(cents) {
  var s = (cents / 100).toFixed(2);
  return s.replace(".", ",") + "\u20AC";
}

function getParam(name) {
  var q = window.location.search.substring(1);
  var parts = q.split("&");
  for (var i = 0; i < parts.length; i++) {
    var kv = parts[i].split("=");
    if (kv[0] === name) { return decodeURIComponent(kv[1] || ""); }
  }
  return "";
}

function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function buildMenu() {
  var nav = "";
  var html = "";
  for (var i = 0; i < MENU.length; i++) {
    var cat = MENU[i];
    var id = slug(cat.c);
    nav += '<a href="#c-' + id + '">' + cat.c + '</a>';
    html += '<div class="cat" id="c-' + id + '"><h2>' + cat.c + '</h2>';
    for (var j = 0; j < cat.items.length; j++) {
      var it = cat.items[j];
      var key = i + "-" + j;
      html += '<div class="item"><div class="info"><div class="nm">' + it.n + '</div>';
      if (it.d) { html += '<div class="dt">' + it.d + '</div>'; }
      html += '<div class="pr">' + euro(it.p) + '</div></div>';
      html += '<div class="ctl">';
      html += '<button class="btn hid" id="m-' + key + '" onclick="chg(\'' + key + '\',-1)">&minus;</button>';
      html += '<span class="qty hid" id="q-' + key + '"></span>';
      html += '<button class="btn add" onclick="chg(\'' + key + '\',1)">+</button>';
      html += '</div></div>';
    }
    html += '</div>';
  }
  document.getElementById("catnav").innerHTML = nav;
  document.getElementById("menu").innerHTML = html;
}

function itemByKey(key) {
  var ix = key.split("-");
  return MENU[parseInt(ix[0], 10)].items[parseInt(ix[1], 10)];
}

function chg(key, delta) {
  var cur = basket[key] || 0;
  cur += delta;
  if (cur < 0) { cur = 0; }
  if (cur === 0) { delete basket[key]; delete itemNotes[key]; } else { basket[key] = cur; }
  var m = document.getElementById("m-" + key);
  var q = document.getElementById("q-" + key);
  if (cur > 0) {
    m.className = "btn";
    q.className = "qty";
    q.innerHTML = cur;
  } else {
    m.className = "btn hid";
    q.className = "qty hid";
  }
  updateBar();
}

function basketTotals() {
  var count = 0;
  var total = 0;
  for (var key in basket) {
    if (basket.hasOwnProperty(key)) {
      var it = itemByKey(key);
      count += basket[key];
      total += it.p * basket[key];
    }
  }
  return {count: count, total: total};
}

function updateBar() {
  var t = basketTotals();
  var bar = document.getElementById("basketbar");
  if (t.count > 0) {
    bar.className = "bar";
    document.getElementById("basketbtn").innerHTML = "View order (" + t.count + ") &middot; " + euro(t.total);
  } else {
    bar.className = "bar hid";
  }
}

function openBasket() {
  var html = "";
  for (var key in basket) {
    if (basket.hasOwnProperty(key)) {
      var it = itemByKey(key);
      var nv = (itemNotes[key] || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      html += '<div class="lwrap"><div class="line"><div class="li"><div class="nm">' + it.n + '</div>';
      html += '<div class="pr">' + euro(it.p) + '</div></div>';
      html += '<div class="lc">';
      html += '<button class="btn" onclick="chgLine(\'' + key + '\',-1)">&minus;</button>';
      html += '<span class="qty">' + basket[key] + '</span>';
      html += '<button class="btn add" onclick="chgLine(\'' + key + '\',1)">+</button>';
      html += '</div></div>';
      html += '<input class="lnote" placeholder="e.g. no ice, no onion" value="' + nv + '" oninput="setNote(\'' + key + '\', this.value)">';
      html += '</div>';
    }
  }
  document.getElementById("lines").innerHTML = html;
  document.getElementById("ptotal").innerHTML = euro(basketTotals().total);
  document.getElementById("panel").className = "panel";
}

function setNote(key, val) {
  if (val) { itemNotes[key] = val; } else { delete itemNotes[key]; }
}

function chgLine(key, delta) {
  chg(key, delta);
  var t = basketTotals();
  if (t.count === 0) { closeBasket(); return; }
  openBasket();
}

function closeBasket() {
  document.getElementById("panel").className = "panel hid";
}

function sendOrder() {
  var t = basketTotals();
  if (t.count === 0) { return; }
  var items = [];
  for (var key in basket) {
    if (basket.hasOwnProperty(key)) {
      var it = itemByKey(key);
      var line = {name: it.n, qty: basket[key], price: it.p};
      if (itemNotes[key]) { line.note = itemNotes[key]; }
      items.push(line);
    }
  }
  var body = {
    table_no: tableNo,
    items: items,
    total: t.total,
    note: document.getElementById("onote").value || null,
    status: "new"
  };
  var btn = document.getElementById("sendbtn");
  btn.disabled = true;
  btn.innerHTML = "Sending...";
  fetch(SUPABASE_URL + "/rest/v1/bar_orders", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(body)
  }).then(function(res) {
    btn.disabled = false;
    btn.innerHTML = "Send order to the bar";
    if (res.ok) {
      document.getElementById("panel").className = "panel hid";
      document.getElementById("donepanel").className = "panel";
      document.getElementById("donehead").innerHTML = "Order sent - Table " + tableNo;
    } else {
      alert("Could not send your order. Please try again, or order at the bar.");
    }
  }).then(null, function(err) {
    btn.disabled = false;
    btn.innerHTML = "Send order to the bar";
    alert("No connection. Please try again, or order at the bar.");
  });
}

function resetOrder() {
  basket = {};
  itemNotes = {};
  document.getElementById("onote").value = "";
  document.getElementById("donepanel").className = "panel hid";
  buildMenu();
  updateBar();
  window.scrollTo(0, 0);
}

function setTable() {
  var v = document.getElementById("tinput").value;
  if (!v) { return; }
  tableNo = "" + v;
  try { localStorage.setItem("mpm_table", tableNo); } catch (e) {}
  document.getElementById("tprompt").className = "tprompt hid";
  document.getElementById("menuwrap").className = "";
  document.getElementById("tbadge").innerHTML = "Table " + tableNo;
}

function init() {
  var t = getParam("table");
  if (!t) {
    try { t = localStorage.getItem("mpm_table") || ""; } catch (e) { t = ""; }
  }
  buildMenu();
  if (t) {
    tableNo = t;
    document.getElementById("tbadge").innerHTML = "Table " + tableNo;
  } else {
    document.getElementById("tprompt").className = "tprompt";
    document.getElementById("menuwrap").className = "hid";
  }
}

init();
</script>
