<meta charset="UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #F3F4F6; color: #111827; min-height: 100vh; }

  /* ---------- header + navigation ---------- */
  .header { background: #E41E26; color: #FFFFFF; padding: 18px 20px 14px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.2px; }
  .header-sub { font-size: .75rem; opacity: .85; margin-top: 2px; }
  .header-meta { font-size: .78rem; opacity: .9; }

  .sticky { position: -webkit-sticky; position: sticky; top: 0; z-index: 30; box-shadow: 0 2px 6px rgba(17,24,39,.08); }
  .report-nav { background: #C0161C; padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .report-nav::-webkit-scrollbar { display: none; }
  .rnav-tab { padding: 7px 13px; font-size: .78rem; font-weight: 600; color: #FFE4E5; border-radius: 999px; cursor: pointer; white-space: nowrap; background: #A91319; -webkit-tap-highlight-color: transparent; }
  .rnav-tab.active { background: #FFFFFF; color: #C0161C; }

  .store-bar { background: #FFFFFF; border-bottom: 1px solid #E5E7EB; padding: 8px 12px; display: flex; }
  .seg { display: -webkit-inline-box; display: inline-flex; background: #F3F4F6; border-radius: 10px; padding: 3px; }
  .store-tab { padding: 7px 16px; font-size: .84rem; font-weight: 600; color: #4B5563; cursor: pointer; border-radius: 8px; user-select: none; -webkit-user-select: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .store-tab.active { background: #FFFFFF; color: #C0161C; box-shadow: 0 1px 3px rgba(17,24,39,.12); }

  .main { padding: 16px; max-width: 1240px; margin: 0 auto; }

  .status-bar { display: flex; align-items: center; gap: 8px; font-size: .76rem; color: #6B7280; margin-bottom: 14px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #D1D5DB; flex-shrink: 0; }
  .status-dot.ok { background: #1B7E3E; }
  .status-dot.err { background: #C62828; }
  .status-dot.loading { background: #D98E04; }

  /* ---------- KPI tiles ---------- */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 12px 14px; }
  .kpi-l { font-size: .68rem; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: .3px; line-height: 1.3; min-height: 1.8em; }
  .kpi-v { font-size: 1.28rem; font-weight: 700; color: #111827; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .kpi-s { font-size: .68rem; color: #9CA3AF; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- charts ---------- */
  .chart-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  .chart-card { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 14px 14px 10px; min-width: 0; }
  .chart-title { font-size: .86rem; font-weight: 700; color: #111827; }
  .chart-sub { font-size: .72rem; color: #6B7280; margin: 2px 0 10px; }
  .chart-box { position: relative; width: 100%; }

  @media (min-width: 820px) {
    .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    .chart-grid { grid-template-columns: 1fr 1fr; }
    .chart-card.full { grid-column: 1 / -1; }
  }

  @-webkit-keyframes rise { from { opacity: 0; -webkit-transform: translateY(6px); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .kpi, .chart-card, .table-card { -webkit-animation: rise .3s ease; animation: rise .3s ease; }

  /* ---------- table ---------- */
  .table-card { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; overflow: hidden; }
  .tbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid #F0F1F3; align-items: center; }
  .tbar input { flex: 1; min-width: 0; font-size: 16px; padding: 9px 12px; border: 1px solid #D1D5DB; border-radius: 10px; background: #F9FAFB; color: #111827; -webkit-appearance: none; }
  .tbar input:focus { outline: none; border-color: #E41E26; background: #FFFFFF; }
  .btn { font-size: .78rem; font-weight: 600; padding: 9px 12px; border: 1px solid #D1D5DB; border-radius: 10px; background: #FFFFFF; color: #374151; cursor: pointer; white-space: nowrap; -webkit-appearance: none; }
  .tnote { font-size: .72rem; color: #6B7280; padding: 8px 12px; background: #FAFAFB; border-bottom: 1px solid #F0F1F3; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .report-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .82rem; }
  .report-table th { background: #F9FAFB; color: #4B5563; font-weight: 700; padding: 10px 12px; text-align: right; font-size: .68rem; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; border-bottom: 1px solid #E5E7EB; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .report-table th:first-child { text-align: left; }
  .sarr { color: #E41E26; margin-left: 4px; font-size: .6rem; }
  .report-table td { padding: 10px 12px; border-bottom: 1px solid #F0F1F3; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: #111827; background: #FFFFFF; }
  .report-table td:first-child, .report-table th:first-child { position: -webkit-sticky; position: sticky; left: 0; z-index: 2; }
  .report-table th:first-child { z-index: 3; }
  .report-table td:first-child { text-align: left; white-space: normal; min-width: 190px; max-width: 280px; font-weight: 500; box-shadow: 1px 0 0 #F0F1F3; }

  tr.parent { cursor: pointer; -webkit-tap-highlight-color: rgba(228,30,38,.08); }
  tr.parent td:first-child { font-weight: 600; }
  tr.open td { background: #FFF5F5; }
  tr.sub td { background: #FAFAFB; font-size: .78rem; }
  tr.sub.open td { background: #F5F6F8; }
  tr.sub.d1 td:first-child { padding-left: 30px; }
  tr.sub.d2 td:first-child { padding-left: 46px; }
  tr.sub.d3 td:first-child, tr.sub.d4 td:first-child { padding-left: 62px; }
  tr.total-row td { background: #F3F4F6; font-weight: 700; }
  .chev { display: inline-block; width: 14px; color: #E41E26; font-size: .7rem; -webkit-transition: -webkit-transform .15s; transition: transform .15s; }
  .chev.sp { color: transparent; }
  tr.open > td > .chev { -webkit-transform: rotate(90deg); transform: rotate(90deg); }
  .cnt { display: inline-block; font-size: .64rem; font-weight: 600; color: #6B7280; background: #F3F4F6; border-radius: 999px; padding: 2px 7px; margin-left: 4px; vertical-align: 1px; }
  tr.open .cnt { background: #FFFFFF; }
  .tag { font-size: .66rem; color: #9CA3AF; font-weight: 500; margin-top: 2px; }
  td.info { text-align: left !important; color: #6B7280; font-size: .74rem; background: #FAFAFB; position: static !important; }
  tr.more td { text-align: center !important; color: #C0161C; font-weight: 600; cursor: pointer; background: #FFFFFF; position: static !important; }

  .pos { color: #1B7E3E !important; }
  .neg { color: #C62828 !important; }
  .nil { color: #C4C8CF !important; }

  .foot { text-align: right; font-size: .7rem; color: #9CA3AF; margin-top: 10px; }
  .loading-msg, .error-msg { text-align: center; padding: 50px 20px; font-size: .95rem; color: #6B7280; }
  .error-msg { color: #C62828; }

  @media (max-width: 600px) {
    .main { padding: 12px; }
    .store-tab { padding: 7px 12px; font-size: .8rem; }
    .kpi-v { font-size: 1.12rem; }
    .report-table td:first-child, .report-table th:first-child { min-width: 140px; max-width: 160px; white-space: normal; }
    .report-table td, .report-table th { padding-left: 9px; padding-right: 9px; }
  }
</style>

<script>
var BASE_URL = 'https://raw.githubusercontent.com/aarondoyle2026/aarondoyle2026.github.io/main/';
var STORE_ORDER = ['Palmerstown', 'Balbriggan', 'Skerries'];
var STORE_COL = { Palmerstown: '#C0161C', Balbriggan: '#1F5A8B', Skerries: '#D98E04' };
var CAT = ['#C0161C', '#1F5A8B', '#D98E04', '#2A9D8F', '#7B4B94'];
var OTHER_COL = '#B8BCC4';
var UP_COL = '#1B7E3E';
var DOWN_COL = '#C62828';
var BAR_COL = '#C0161C';
var PAGE = 150;
var SEARCH_CAP = 300;
var DEPT_RE = /^\s*D\d{4}\s*-/;
var TOTAL_RE = /^\s*total\b/i;

var REPORTS = [
  { label: 'Meat Weekly',         file: 'meat_weekly_data.json' },
  { label: 'Dairy Weekly',        file: 'dairy_weekly_data.json' },
  { label: 'Bakery Weekly',       file: 'bakery_weekly_data.json' },
  { label: 'Produce Weekly',      file: 'produce_weekly_data.json' },
  { label: 'Deli Weekly',         file: 'deli_weekly_data.json' },
  { label: 'Full MS Weekly',      file: 'full_ms_weekly_data.json' },
  { label: 'Top Sellers',         file: 'top_sellers_data.json' },
  { label: 'Top Cash Margin',     file: 'top_cash_margin_data.json' },
  { label: 'Hourly Sales',        file: 'hourly_sales_data.json' },
  { label: 'Dept Report Week',    file: 'dept_report_latest_data.json' },
  { label: 'Dept Report YTD',     file: 'dept_report_ytd_data.json' },
  { label: 'Ownbrand',            file: 'ownbrand_data.json' },
  { label: 'Waste Top 50',        file: 'waste_top50_data.json' },
  { label: 'Waste Report',        file: 'waste_report_data.json' }
];

var cache = {};
var detailCache = {};
var activeReport = 0;
var activeStore = 'Palmerstown';
var activeDate = null;
var availableStores = [];
var M = null;
var sortCol = -1;
var sortDir = -1;
var query = '';
var _searchTimer = null;

var _session=null;try{_session=JSON.parse(localStorage.getItem('portal_session'));}catch(e){}
var _userRole=_session?(_session.role||''):'';
var _userStore=_session?(_session.store_code||''):'';
var _storeMap={palmerstown:'Palmerstown',balbriggan:'Balbriggan',skerries:'Skerries'};
var _userStoreName=_storeMap[_userStore]||'';

/* ---------- FORMATTING ---------- */
function trunc(s, n) {
  s = String(s === null || s === undefined ? '' : s);
  return s.length > n ? s.substring(0, n - 1) + '…' : s;
}
function fmtMoneyShort(v) {
  var a = Math.abs(v); var s = v < 0 ? '-' : '';
  if (a >= 1000000) return s + '€' + (a / 1000000).toFixed(1) + 'm';
  if (a >= 1000) return s + '€' + (a / 1000).toFixed(a >= 100000 ? 0 : 1) + 'k';
  return s + '€' + a.toFixed(0);
}
function fmtMoneyFull(v) {
  return (v < 0 ? '-' : '') + '€' + Math.abs(v).toLocaleString('en-IE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtCountV(v) { return Math.round(v).toLocaleString('en-IE'); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function isCountField(colHeader, rowLabel) {
  var combined = ((colHeader || '') + ' ' + (rowLabel || '')).toLowerCase();
  return combined.indexOf('qty') !== -1 || combined.indexOf('count') !== -1 || combined.indexOf('units') !== -1;
}
function dedupeHeaders(headers) {
  var seen = {};
  return headers.map(function(h) {
    if (!h) return h;
    if (!seen[h]) { seen[h] = 1; return h; }
    seen[h]++;
    return h + ' _' + seen[h];
  });
}
function fmtVal(v, col, t) {
  if (t === 'pct' || (t !== 'num' && col.kind === 'pct')) return (col.isVar && v > 0 ? '+' : '') + v.toFixed(2) + '%';
  if (col.isCount) return fmtCountV(v);
  return fmtMoneyFull(v);
}
function valClass(v, col) {
  if (!col.isVar || !v) return '';
  return v < 0 ? 'neg' : 'pos';
}

/* ---------- MODEL ---------- */
function colKind(rows, key) {
  var p = 0, n = 0, s = 0;
  for (var i = 0; i < rows.length; i++) {
    var c = rows[i][key];
    if (!c || c.v === null || c.v === undefined) continue;
    if (c.t === 'pct') p++; else if (c.t === 'num') n++; else s++;
  }
  if (p && p >= n && p >= s) return 'pct';
  if (n && n >= s) return 'num';
  return 'str';
}
function pickCol(cols, fn) {
  for (var k = 1; k < cols.length; k++) { if (fn(cols[k])) return k; }
  return -1;
}
function pickPrimary(cols) {
  var pri = [/sales/i, /cash/i, /value/i, /cost/i, /amount/i, /total/i, /qty|units|count/i];
  for (var p = 0; p < pri.length; p++) {
    for (var k = 1; k < cols.length; k++) {
      if (cols[k].kind === 'num' && !cols[k].isVar && pri[p].test(cols[k].name)) return k;
    }
  }
  return pickCol(cols, function(c) { return c.kind === 'num'; });
}
function nodesFromRows(rows, cols) {
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var lc = rows[i][cols[0].key];
    var lab = lc && lc.v !== null && lc.v !== undefined ? String(lc.v) : '';
    var cells = [];
    for (var c = 0; c < cols.length; c++) { cells.push(rows[i][cols[c].key] || { v: null, t: 'nil' }); }
    out.push({ label: lab, cells: cells, depth: 0, isTotal: TOTAL_RE.test(lab), isDept: DEPT_RE.test(lab), children: null, open: false, limit: PAGE, leaves: 0 });
  }
  return out;
}
function buildModel(storeData, file) {
  var parsed = storeData.data || {};
  var raw = parsed.headers || [];
  var rows = parsed.rows || [];
  var disp = dedupeHeaders(raw);
  var m = { cols: [], top: [], leaves: [], leafCount: 0, detailStatus: 'loading', storeData: storeData };
  m.detailFile = file.replace('_data.json', '_detail_' + activeStore.toLowerCase() + '.json');
  for (var k = 0; k < raw.length; k++) {
    var nm = (disp[k] || '').replace(/ _\d+$/, '');
    var kind = k === 0 ? 'label' : colKind(rows, raw[k]);
    m.cols.push({ key: raw[k], name: nm, kind: kind, isVar: /var|diff|change|\+\/-/i.test(nm), isCount: isCountField(nm, '') });
  }
  m.keepEmpty = file === 'hourly_sales_data.json';
  m.top = nodesFromRows(rows, m.cols);
  if (!m.keepEmpty) m.top = pruneEmpty(m.top);
  m.top = groupUnderDepts(m.top);
  m.leaves = [];
  m.leafCount = countAllLeaves(m.top, m.leaves);
  m.primary = pickPrimary(m.cols);
  m.varCol = pickCol(m.cols, function(c) { return c.kind === 'num' && c.isVar && !c.isCount; });
  m.marginCol = pickCol(m.cols, function(c) { return c.kind === 'pct' && /margin/i.test(c.name); });
  return m;
}
/* A line "has data" if any figure is a real non-zero number */
function nodeHasData(n) {
  for (var k = 1; k < n.cells.length; k++) {
    var v = n.cells[k] ? n.cells[k].v : null;
    if (typeof v === 'number' && v !== 0) return true;
  }
  return false;
}
function pruneEmpty(list) {
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var n = list[i];
    if (n.children) {
      n.children = pruneEmpty(n.children);
      if (!n.children.length) n.children = null;
    }
    if (n.isTotal || n.children || nodeHasData(n)) out.push(n);
  }
  return out;
}
/* Lines listed after a D00xx row in the main list are folded under that department */
function groupUnderDepts(list) {
  var hasDept = false;
  for (var i = 0; i < list.length; i++) { if (list[i].isDept) { hasDept = true; break; } }
  if (!hasDept) return list;
  var out = [], cur = null;
  for (var j = 0; j < list.length; j++) {
    var n = list[j];
    if (n.isDept) { cur = n; out.push(n); continue; }
    if (n.isTotal) { cur = null; out.push(n); continue; }
    if (cur) {
      if (!cur.children) cur.children = [];
      n.depth = 1;
      cur.children.push(n);
    } else {
      out.push(n);
    }
  }
  return out;
}
function countAllLeaves(list, acc) {
  var c = 0;
  for (var i = 0; i < list.length; i++) {
    var n = list[i];
    if (n.children && n.children.length) { n.leaves = countLeaves(n.children, acc); c += n.leaves; }
  }
  return c;
}
function numOf(n, k) {
  var c = n.cells[k];
  return c && typeof c.v === 'number' ? c.v : null;
}
/* Headline figure: Total row > single department row > sum of departments > sum of rows */
function headline(nodes, k, kind) {
  var tot = null, depts = [], all = [];
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.isTotal) { if (!tot) tot = n; continue; }
    if (n.isDept) depts.push(n);
    all.push(n);
  }
  if (tot) { var tv = numOf(tot, k); return tv === null ? null : { v: tv, how: 'Total' }; }
  if (depts.length === 1) { var dv = numOf(depts[0], k); return dv === null ? null : { v: dv, how: trunc(depts[0].label, 32) }; }
  if (kind === 'pct') return null;
  var src = depts.length ? depts : all, s = 0, any = false;
  for (var j = 0; j < src.length; j++) { var x = numOf(src[j], k); if (x !== null) { s += x; any = true; } }
  return any ? { v: s, how: depts.length ? 'Sum of departments' : 'Sum of listed rows' } : null;
}
function topItems(list) {
  var out = [], depts = 0;
  for (var i = 0; i < list.length; i++) {
    if (list[i].isTotal) continue;
    out.push(list[i]);
    if (list[i].isDept) depts++;
  }
  if (depts === 1 && out.length > 1) out = out.filter(function(n) { return !n.isDept; });
  return out;
}
function usingLeaves() { return M.leafCount > 0; }
function chartItems() { return usingLeaves() ? M.leaves : topItems(M.top); }
function itemWord(items) {
  if (usingLeaves()) return 'lines';
  for (var i = 0; i < items.length; i++) { if (!items[i].isDept) return 'lines'; }
  return 'departments';
}

/* ---------- LINE DETAIL (drill-down) ---------- */
function loadDetail(m) {
  var f = m.detailFile;
  if (detailCache[f]) { applyDetail(m, detailCache[f]); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', BASE_URL + f + '?_=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    var obj = { none: true };
    if (xhr.status === 200) { try { obj = JSON.parse(xhr.responseText); } catch (e) { obj = { none: true }; } }
    detailCache[f] = obj;
    if (M === m) applyDetail(m, obj);
  };
  xhr.send();
}
function detailNode(m, line, pos) {
  var label = '';
  for (var j = 1; j < line.length; j++) { if (typeof line[j] === 'string' && line[j]) { label = line[j]; break; } }
  var cells = [{ v: label, t: 'str' }];
  for (var k = 1; k < m.cols.length; k++) {
    var fi = pos[k];
    var v = fi === undefined ? null : line[1 + fi];
    if (v === null || v === undefined || v === '' || v === label) cells.push({ v: null, t: 'nil' });
    else if (typeof v === 'string') cells.push({ v: v, t: 'str' });
    else cells.push({ v: v, t: m.cols[k].kind === 'pct' ? 'pct' : 'num' });
  }
  return { label: label, cells: cells, depth: 1, rank: 1, isTotal: false, isDept: false, children: null, open: false, limit: PAGE, leaves: 0 };
}
function buildTree(m, lines, pos) {
  var roots = [], stack = [];
  for (var i = 0; i < lines.length; i++) {
    var node = detailNode(m, lines[i], pos);
    var r = lines[i][0] || 1;
    node.rank = r;
    while (stack.length && stack[stack.length - 1].rank >= r) stack.pop();
    node.depth = stack.length + 1;
    if (stack.length) {
      var p = stack[stack.length - 1];
      if (!p.children) p.children = [];
      p.children.push(node);
    } else {
      roots.push(node);
    }
    stack.push(node);
  }
  return roots;
}
function countLeaves(list, acc) {
  var c = 0;
  for (var i = 0; i < list.length; i++) {
    var n = list[i];
    if (n.children && n.children.length) { n.leaves = countLeaves(n.children, acc); c += n.leaves; }
    else { c++; acc.push(n); }
  }
  return c;
}
function applyDetail(m, obj) {
  if (!obj || obj.none || !obj.detail || (obj.date && obj.date !== activeDate)) {
    m.detailStatus = 'none';
  } else {
    var hs = obj.headers || [], pos = [];
    for (var j = 0; j < hs.length; j++) {
      if (hs[j] !== null && hs[j] !== undefined && String(hs[j]).replace(/^\s+|\s+$/g, '') !== '') pos.push(j);
    }
    walk(m.top, '', function(n) {
      if (n.isTotal || n.children) return;
      var lines = obj.detail[n.label];
      if (!lines || !lines.length) return;
      n.children = buildTree(m, lines, pos);
      if (!m.keepEmpty) n.children = pruneEmpty(n.children);
      if (!n.children.length) n.children = null;
    });
    m.detailStatus = 'ok';
  }
  m.leaves = [];
  m.leafCount = countAllLeaves(m.top, m.leaves);
  if (M !== m) return;
  renderBody();
  renderKpis();
  renderCharts();
  updateNote();
}

function renderKpis() {
  if (!M || !M.kpiBox) return;
  var html = [], shown = 0;
  for (var k = 1; k < M.cols.length && shown < 4; k++) {
    var col = M.cols[k];
    if (col.kind !== 'num' && col.kind !== 'pct') continue;
    var h = headline(M.top, k, col.kind);
    if (!h) continue;
    html.push('<div class="kpi"><div class="kpi-l">' + esc(trunc(col.name, 40)) + '</div><div class="kpi-v ' + valClass(h.v, col) + '">' + esc(fmtVal(h.v, col, col.kind)) + '</div><div class="kpi-s">' + esc(h.how) + '</div></div>');
    shown++;
  }
  if (shown < 4) {
    var items = topItems(M.top);
    if (usingLeaves()) html.push('<div class="kpi"><div class="kpi-l">Lines</div><div class="kpi-v">' + fmtCountV(M.leafCount) + '</div><div class="kpi-s">Across ' + items.length + ' groups</div></div>');
    else html.push('<div class="kpi"><div class="kpi-l">' + (itemWord(items) === 'departments' ? 'Departments' : 'Lines') + '</div><div class="kpi-v">' + fmtCountV(items.length) + '</div><div class="kpi-s">In this report</div></div>');
  }
  M.kpiBox.innerHTML = html.join('');

/* ---------- TABLE ---------- */
function renderHead() {
  var tr = document.createElement('tr');
  for (var k = 0; k < M.cols.length; k++) {
    var th = document.createElement('th');
    th.innerHTML = esc(M.cols[k].name) + (sortCol === k ? '<span class="sarr">' + (sortDir < 0 ? '▼' : '▲') + '</span>' : '');
    th.onclick = makeSort(k);
    tr.appendChild(th);
  }
  while (M.thead.firstChild) M.thead.removeChild(M.thead.firstChild);
  M.thead.appendChild(tr);
}
function makeSort(k) {
  return function() {
    var first = k === 0 ? 1 : -1;
    if (sortCol !== k) { sortCol = k; sortDir = first; }
    else if (sortDir === first) { sortDir = -first; }
    else { sortCol = -1; }
    renderHead();
    renderBody();
  };
}
function sortList(list) {
  if (sortCol < 0) return list;
  var tots = [], rest = [], k = sortCol, dir = sortDir;
  for (var i = 0; i < list.length; i++) (list[i].isTotal ? tots : rest).push(list[i]);
  rest.sort(function(a, b) {
    var x = a.cells[k] ? a.cells[k].v : null, y = b.cells[k] ? b.cells[k].v : null;
    var xn = x === null || x === undefined || x === '', yn = y === null || y === undefined || y === '';
    if (xn && yn) return 0;
    if (xn) return 1;
    if (yn) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y)) * dir;
  });
  return tots.concat(rest);
}
function fillCell(td, cell, col) {
  var v = cell ? cell.v : null, t = cell ? cell.t : 'nil';
  if (v === null || v === undefined || v === '') { td.className = 'nil'; td.textContent = '–'; return; }
  if (typeof v !== 'number') { td.textContent = v; return; }
  td.textContent = fmtVal(v, col, t);
  var vc = valClass(v, col);
  if (vc) td.className = vc;
}
function nodeRow(n, depth, tag) {
  var tr = document.createElement('tr');
  var canOpen = !tag && n.children && n.children.length;
  var waiting = !tag && !depth && !n.isTotal && M.detailStatus === 'loading';
  var cls = depth ? 'sub d' + Math.min(depth, 4) : 'top';
  if (n.isTotal) cls += ' total-row';
  if (canOpen || waiting) cls += ' parent';
  if (canOpen && n.open) cls += ' open';
  tr.className = cls;
  for (var k = 0; k < M.cols.length; k++) {
    var td = document.createElement('td');
    if (k === 0) {
      var h = '';
      if (canOpen || waiting) h += '<span class="chev">▶</span>';
      else if (depth && !tag) h += '<span class="chev sp">▶</span>';
      h += esc(n.label || '–');
      if (canOpen) h += '<span class="cnt">' + fmtCountV(n.leaves) + '</span>';
      if (tag) h += '<div class="tag">' + esc(tag) + '</div>';
      td.innerHTML = h;
    } else {
      fillCell(td, n.cells[k], M.cols[k]);
    }
    tr.appendChild(td);
  }
  if (canOpen) tr.onclick = function() { n.open = !n.open; renderBody(); };
  else if (waiting) tr.onclick = function() { setNote('Line detail is still loading — try again in a moment.'); };
  return tr;
}
function addNodes(frag, list, depth, parent) {
  var arr = sortList(list);
  var lim = parent ? parent.limit : arr.length;
  for (var i = 0; i < arr.length && i < lim; i++) {
    frag.appendChild(nodeRow(arr[i], depth));
    if (arr[i].open && arr[i].children) addNodes(frag, arr[i].children, depth + 1, arr[i]);
  }
  if (parent && arr.length > lim) {
    var rest = arr.length - lim;
    var tr = document.createElement('tr');
    tr.className = 'more';
    var td = document.createElement('td');
    td.colSpan = M.cols.length;
    td.textContent = 'Show ' + Math.min(PAGE, rest) + ' more (' + fmtCountV(rest) + ' remaining)';
    tr.appendChild(td);
    tr.onclick = function() { parent.limit += PAGE; renderBody(); };
    frag.appendChild(tr);
  }
}
function walk(list, path, fn) {
  for (var i = 0; i < list.length; i++) {
    fn(list[i], path);
    if (list[i].children) walk(list[i].children, path || list[i].label, fn);
  }
}
function infoRow(text) {
  var tr = document.createElement('tr');
  var td = document.createElement('td');
  td.className = 'info';
  td.colSpan = M.cols.length;
  td.textContent = text;
  tr.appendChild(td);
  return tr;
}
function renderSearch(frag) {
  var q = query.toLowerCase(), hits = [];
  walk(M.top, '', function(n, path) {
    if (n.label && n.label.toLowerCase().indexOf(q) !== -1) { n._tag = path || ' '; hits.push(n); }
  });
  hits = sortList(hits);
  var msg = fmtCountV(hits.length) + (hits.length === 1 ? ' match' : ' matches');
  if (hits.length > SEARCH_CAP) msg += ' — showing first ' + SEARCH_CAP;
  if (M.detailStatus === 'loading') msg += ' (line detail still loading)';
  frag.appendChild(infoRow(msg));
  for (var i = 0; i < hits.length && i < SEARCH_CAP; i++) frag.appendChild(nodeRow(hits[i], 0, hits[i]._tag));
}
function renderBody() {
  if (!M || !M.tbody) return;
  var tb = M.tbody;
  while (tb.firstChild) tb.removeChild(tb.firstChild);
  var frag = document.createDocumentFragment();
  if (query.length >= 2) renderSearch(frag); else addNodes(frag, M.top, 0, null);
  tb.appendChild(frag);
}
function collapseAll() {
  walk(M.top, '', function(n) { n.open = false; n.limit = PAGE; });
  renderBody();
}
function setNote(txt) { if (M && M.note) M.note.textContent = txt; }
function updateNote() {
  if (!M) return;
  if (M.detailStatus === 'loading') setNote('Loading line detail… · Tap a column heading to sort');
  else if (M.leafCount > 0) setNote('Tap a department to open its lines · Tap a column heading to sort · ' + fmtCountV(M.leafCount) + ' lines');
  else setNote('Tap a column heading to sort');

}

/* ---------- PAGE ---------- */
function buildReportNav() {
  var nav = document.getElementById('reportNav');
  nav.innerHTML = '';
  REPORTS.forEach(function(r, i) {
    var tab = document.createElement('div');
    tab.className = 'rnav-tab' + (i === activeReport ? ' active' : '');
    tab.textContent = r.label;
    tab.onclick = (function(idx) {
      return function() {
        activeReport = idx;
        buildReportNav();
        loadReport(idx);
      };
    })(i);
    nav.appendChild(tab);
    if (i === activeReport && tab.scrollIntoView) { try { tab.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
  });
}

function loadReport(idx) {
  var report = REPORTS[idx];
  M = null;
  destroyCharts();
  setStatus('loading', 'Loading ' + report.label + '...');
  document.getElementById('content').innerHTML = '<div class="loading-msg">Loading...</div>';
  document.getElementById('storeBar').innerHTML = '';

  if (cache[report.file]) {
    renderReport(cache[report.file]);
    return;
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', BASE_URL + report.file + '?_=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (activeReport !== idx) return;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        cache[report.file] = data;
        renderReport(data);
      } catch (e) {
        setStatus('err', 'Parse error');
        showError('Could not parse ' + report.file);
      }
    } else {
      setStatus('err', 'Not found (run the scraper first)');
      showError(report.label + ' data not found. Run the scraper first.');
    }
  };
  xhr.send();
}

function renderReport(data) {
  var dates = Object.keys(data).sort();
  if (!dates.length) { showError('No data found.'); return; }
  activeDate = dates[dates.length - 1];

  var dateStores = data[activeDate] || {};
  var available = STORE_ORDER.filter(function(s) { return dateStores[s]; });
  if (!available.length) { showError('No store data for latest date.'); return; }

  if (_userRole !== 'admin' && _userStoreName) {
    available = available.filter(function(s) { return s === _userStoreName; });
    document.getElementById('storeBar').style.display = 'none';
  }

  if (!available.length) { showError('No data available for your store.'); return; }
  if (available.indexOf(activeStore) === -1) activeStore = available[0];
  availableStores = available;

  buildStoreBar();
  renderStore();

  var report = REPORTS[activeReport];
  document.getElementById('headerMeta').textContent = report.label + ' · ' + activeDate + (_userRole !== 'admin' && _userStoreName ? ' · ' + _userStoreName : '');
  setStatus('ok', 'Data for ' + activeDate + ' · updated weekly');
}

function buildStoreBar() {
  var bar = document.getElementById('storeBar');
  bar.innerHTML = '';
  var seg = document.createElement('div');
  seg.className = 'seg';
  availableStores.forEach(function(store) {
    var tab = document.createElement('div');
    tab.className = 'store-tab' + (store === activeStore ? ' active' : '');
    tab.textContent = store;
    tab.onclick = (function(s) {
      return function() {
        if (s === activeStore) return;
        activeStore = s;
        buildStoreBar();
        renderStore();
      };
    })(store);
    seg.appendChild(tab);
  });
  bar.appendChild(seg);
}

function renderStore() {
  var data = cache[REPORTS[activeReport].file] || {};
  var sd = data[activeDate] ? data[activeDate][activeStore] : null;
  M = null;
  destroyCharts();
  if (!sd) { showError('No data for this store.'); return; }
  if (sd.error) { showError('Scrape error: ' + sd.error); return; }
  if (!sd.data || !sd.data.rows || !sd.data.rows.length) { showError('No rows in data. Run the scraper first.'); return; }

  var m = buildModel(sd, REPORTS[activeReport].file);
  query = '';
  sortCol = -1;
  sortDir = -1;

  var content = document.getElementById('content');
  content.innerHTML = '';

  m.kpiBox = document.createElement('div');
  m.kpiBox.className = 'kpi-grid';
  content.appendChild(m.kpiBox);

  m.chartGrid = document.createElement('div');
  m.chartGrid.className = 'chart-grid';
  content.appendChild(m.chartGrid);

  var card = document.createElement('div');
  card.className = 'table-card';
  var tbar = document.createElement('div');
  tbar.className = 'tbar';
  var input = document.createElement('input');
  input.type = 'search';
  input.placeholder = 'Search lines…';
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.oninput = function() {
    var val = input.value.replace(/^\s+|\s+$/g, '');
    if (_searchTimer) clearTimeout(_searchTimer);
    _searchTimer = setTimeout(function() { query = val; renderBody(); }, 200);
  };
  tbar.appendChild(input);
  m.collapseBtn = document.createElement('button');
  m.collapseBtn.className = 'btn';
  m.collapseBtn.textContent = 'Collapse all';
  m.collapseBtn.onclick = function() { collapseAll(); };
  tbar.appendChild(m.collapseBtn);
  card.appendChild(tbar);

  m.note = document.createElement('div');
  m.note.className = 'tnote';
  card.appendChild(m.note);

  var wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  var table = document.createElement('table');
  table.className = 'report-table';
  m.thead = document.createElement('thead');
  m.tbody = document.createElement('tbody');
  table.appendChild(m.thead);
  table.appendChild(m.tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  content.appendChild(card);

  if (sd.scraped_at) {
    var meta = document.createElement('p');
    meta.className = 'foot';
    meta.textContent = 'Scraped: ' + sd.scraped_at.replace('T', ' ').substring(0, 19);
    content.appendChild(meta);
  }

  M = m;
  renderKpis();
  renderHead();
  renderBody();
  renderCharts();
  updateNote();
  loadDetail(m);
}

function setStatus(type, msg) {
  var dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + type;
  document.getElementById('statusText').textContent = msg;
}

function showError(msg) {
  M = null;
  destroyCharts();
  document.getElementById('content').innerHTML = '<div class="error-msg">' + esc(msg) + '</div>';
}

buildReportNav();
loadReport(0);
</script>
</body>
</html>
