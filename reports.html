<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){var a=sessionStorage.getItem('portal_auth_token');if(a){sessionStorage.removeItem('portal_auth_token');}else{localStorage.removeItem('portal_session');window.location.replace('https://aarondoyle2026.github.io/login.html?to='+encodeURIComponent(window.location.href));}})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Moriarty Group</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; color: #1a1a1a; min-height: 100vh; }

  .header { background: #e41e26; color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .header h1 { font-size: 1.1rem; font-weight: 700; }
  .header-meta { font-size: .78rem; opacity: .85; }

  .report-nav { background: #c0161c; padding: 0 16px; display: flex; gap: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .report-nav::-webkit-scrollbar { height: 3px; }
  .report-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); }
  .rnav-tab { padding: 12px 16px; font-size: .78rem; font-weight: 600; color: rgba(255,255,255,0.65); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: color .2s, border-color .2s; }
  .rnav-tab:hover { color: #fff; }
  .rnav-tab.active { color: #fff; border-bottom-color: #ffffff; }

  .store-bar { background: #fff; border-bottom: 2px solid #e0e0e0; padding: 0 20px; display: flex; gap: 0; }
  .store-tab { padding: 12px 24px; font-size: .88rem; font-weight: 600; color: #555; cursor: pointer; border-bottom: 3px solid transparent; transition: color .2s, border-color .2s; user-select: none; white-space: nowrap; }
  .store-tab:hover { color: #e41e26; }
  .store-tab.active { color: #e41e26; border-bottom-color: #e41e26; }

  .main { padding: 20px; max-width: 1200px; margin: 0 auto; }

  .status-bar { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 16px; margin-bottom: 16px; font-size: .8rem; color: #555; display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .status-dot.ok { background: #e41e26; }
  .status-dot.err { background: #d32f2f; }
  .status-dot.loading { background: #ff9800; }

  .chart-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px 14px 10px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .chart-title { font-size: .74rem; font-weight: 700; color: #c0161c; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; }
  .chart-box { position: relative; width: 100%; }
  @media (min-width: 820px) {
    .chart-grid { grid-template-columns: 1fr 1fr; }
    .chart-card.full { grid-column: 1 / -1; }
  }

  @-webkit-keyframes rise { from { opacity: 0; -webkit-transform: translateY(6px); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .chart-card, .table-wrap { -webkit-animation: rise .35s ease; animation: rise .35s ease; }

  .table-wrap { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow-x: auto; }
  .report-table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 500px; }
  .report-table thead th { background: #c0161c; color: #fff; font-weight: 700; padding: 10px 12px; text-align: right; font-size: .75rem; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; }
  .report-table thead th:first-child { text-align: left; min-width: 180px; }
  .report-table tbody tr { border-bottom: 1px solid #f0f0f0; }
  .report-table tbody tr:last-child { border-bottom: none; }
  .report-table tbody tr:hover { background: #f8fcf8; }
  .report-table tbody tr.total-row { background: #f0f4f0; font-weight: 700; }
  .report-table td { padding: 9px 12px; vertical-align: middle; white-space: nowrap; }
  .report-table td:first-child { text-align: left; white-space: normal; font-weight: 500; color: #333; }
  .report-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }

  .val-positive { color: #1b7e3e; }
  .val-negative { color: #c62828; }
  .val-neutral { color: #555; }
  .val-nil { color: #bbb; }

  .loading-msg, .error-msg { text-align: center; padding: 50px 20px; font-size: .95rem; color: #888; }
  .error-msg { color: #c62828; }

  @media (max-width: 600px) {
    .store-tab { padding: 10px 14px; font-size: .82rem; }
    .main { padding: 12px; }
  }
</style>
</head>
<body>


<div class="header">
  <h1>&#128221; Reports - Moriarty Group</h1>
  <div class="header-meta" id="headerMeta">Loading...</div>
</div>

<div class="report-nav" id="reportNav"></div>
<div class="store-bar" id="storeBar"></div>

<div class="main">
  <div class="status-bar">
    <div class="status-dot loading" id="statusDot"></div>
    <span id="statusText">Loading...</span>
  </div>
  <div id="content"><div class="loading-msg">Select a report above.</div></div>
</div>

<script>
var BASE_URL = 'https://raw.githubusercontent.com/aarondoyle2026/aarondoyle2026.github.io/main/';
var STORE_ORDER = ['Palmerstown', 'Balbriggan', 'Skerries'];

var REPORTS = [
  { label: 'Meat Weekly',         file: 'meat_weekly_data.json' },
  { label: 'Dairy Weekly',        file: 'dairy_weekly_data.json' },
  { label: 'Bakery Weekly',       file: 'bakery_weekly_data.json' },
  { label: 'Produce Weekly',      file: 'produce_weekly_data.json' },
  { label: 'Deli Weekly',         file: 'deli_weekly_data.json' },
  { label: 'Full MS Weekly',      file: 'full_ms_weekly_data.json' },
  { label: 'Top Sellers',         file: 'top_sellers_data.json' },
  { label: 'Top Cash Margin',     file: 'top_cash_margin_data.json' },
  { label: 'Hourly Sales',        file: 'hourly_sales_data.json' },
  { label: 'Dept Report Week',    file: 'dept_report_latest_data.json' },
  { label: 'Dept Report YTD',     file: 'dept_report_ytd_data.json' },
  { label: 'Ownbrand',            file: 'ownbrand_data.json' },
];

var cache = {};
var activeReport = 0;
var activeStore = 'Palmerstown';
var activeDate = null;

var _session=null;try{_session=JSON.parse(localStorage.getItem('portal_session'));}catch(e){}
var _userRole=_session?(_session.role||''):'';
var _userStore=_session?(_session.store_code||''):'';
var _storeMap={palmerstown:'Palmerstown',balbriggan:'Balbriggan',skerries:'Skerries'};
var _userStoreName=_storeMap[_userStore]||'';

/* ---------- CHART LAYER ---------- */
var _charts = [];
var PAL = ['#E41E26','#8E0F13','#F0757B','#C0161C','#FFB0B4','#7A7A7A','#B5B5B5','#D9D9D9'];

if (window.Chart) {
  Chart.defaults.global.defaultFontFamily = "'Segoe UI', Arial, sans-serif";
  Chart.defaults.global.defaultFontColor = '#666';
  Chart.defaults.global.animation.duration = 500;
}

function destroyCharts() {
  for (var i = 0; i < _charts.length; i++) { try { _charts[i].destroy(); } catch(e) {} }
  _charts = [];
}

function trunc(s, n) {
  s = String(s === null || s === undefined ? '' : s);
  return s.length > n ? s.substring(0, n - 1) + '...' : s;
}

function fmtMoneyShort(v) {
  var a = Math.abs(v); var s = v < 0 ? '-' : '';
  if (a >= 1000000) return s + '\u20AC' + (a / 1000000).toFixed(1) + 'm';
  if (a >= 1000) return s + '\u20AC' + (a / 1000).toFixed(a >= 100000 ? 0 : 1) + 'k';
  return s + '\u20AC' + a.toFixed(0);
}

function fmtMoneyFull(v) {
  return (v < 0 ? '-' : '') + '\u20AC' + Math.abs(v).toLocaleString('en-IE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function fmtCountV(v) { return Math.round(v).toLocaleString(); }

function isNumericHeader(rows, h) {
  var n = 0, c = 0;
  for (var i = 0; i < rows.length; i++) {
    var cell = rows[i][h];
    if (cell && cell.v !== null && cell.v !== undefined) {
      c++;
      if (typeof cell.v === 'number' && cell.t !== 'pct') n++;
    }
  }
  return c > 0 && n >= c * 0.6;
}

function numericHeaders(rawHeaders, rows) {
  var out = [];
  for (var i = 1; i < rawHeaders.length; i++) {
    var h = rawHeaders[i];
    if (h && isNumericHeader(rows, h)) out.push(h);
  }
  return out;
}

function pickValueHeader(numHs) {
  var pri = [/sales/i, /cash/i, /value/i, /amount/i, /total/i, /qty|units|count/i];
  for (var p = 0; p < pri.length; p++) {
    for (var i = 0; i < numHs.length; i++) { if (pri[p].test(numHs[i])) return numHs[i]; }
  }
  return numHs[0] || null;
}

function chartDataRows(rows, firstH) {
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var c = rows[i][firstH];
    var lab = (c && c.v !== null && c.v !== undefined) ? String(c.v) : '';
    if (lab && lab.toLowerCase().indexOf('total') === -1) out.push(rows[i]);
  }
  return out;
}

function pointsFrom(rows, firstH, valH) {
  var pts = [];
  for (var i = 0; i < rows.length; i++) {
    var lc = rows[i][firstH]; var vc = rows[i][valH];
    if (!lc || lc.v === null || lc.v === undefined) continue;
    if (!vc || typeof vc.v !== 'number') continue;
    if (vc.v === 0) continue;
    pts.push({ l: String(lc.v), v: vc.v });
  }
  return pts;
}

function addCard(grid, title, height, full) {
  var card = document.createElement('div');
  card.className = 'chart-card' + (full ? ' full' : '');
  var t = document.createElement('div');
  t.className = 'chart-title';
  t.textContent = title;
  card.appendChild(t);
  var box = document.createElement('div');
  box.className = 'chart-box';
  box.style.height = height + 'px';
  var cv = document.createElement('canvas');
  box.appendChild(cv);
  card.appendChild(box);
  grid.appendChild(card);
  return cv;
}

function barChart(grid, title, pts, isCount) {
  var sorted = pts.slice().sort(function(a, b) { return b.v - a.v; }).slice(0, 12);
  if (sorted.length < 2) return;
  var labels = [], vals = [];
  for (var i = 0; i < sorted.length; i++) { labels.push(trunc(sorted[i].l, 20)); vals.push(sorted[i].v); }
  var h = Math.max(220, Math.min(420, sorted.length * 32 + 50));
  var cv = addCard(grid, title, h, false);
  var fmtAxis = function(v) { return isCount ? fmtCountV(v) : fmtMoneyShort(v); };
  var c = new Chart(cv.getContext('2d'), {
    type: 'horizontalBar',
    data: { labels: labels, datasets: [{ data: vals, backgroundColor: '#E41E26', borderWidth: 0, barPercentage: 0.72 }] },
    options: {
      responsive: true, maintainAspectRatio: false, legend: { display: false },
      scales: {
        xAxes: [{ ticks: { beginAtZero: true, callback: fmtAxis, maxTicksLimit: 6 }, gridLines: { color: '#f0f0f0' } }],
        yAxes: [{ gridLines: { display: false }, ticks: { fontSize: 11 } }]
      },
      tooltips: { callbacks: { label: function(t) { return isCount ? fmtCountV(t.xLabel) : fmtMoneyFull(t.xLabel); } } }
    }
  });
  _charts.push(c);
}

function doughnutChart(grid, title, pts, isCount) {
  var pos = [];
  for (var i = 0; i < pts.length; i++) { if (pts[i].v > 0) pos.push(pts[i]); }
  pos.sort(function(a, b) { return b.v - a.v; });
  pos = pos.slice(0, 8);
  if (pos.length < 2) return;
  var labels = [], vals = [], cols = [];
  for (var j = 0; j < pos.length; j++) { labels.push(trunc(pos[j].l, 16)); vals.push(pos[j].v); cols.push(PAL[j % PAL.length]); }
  var cv = addCard(grid, title, 260, false);
  var c = new Chart(cv.getContext('2d'), {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: vals, backgroundColor: cols, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutoutPercentage: 62,
      legend: { display: true, position: 'bottom', labels: { boxWidth: 10, fontSize: 10, padding: 8 } },
      tooltips: { callbacks: { label: function(t, d) {
        var v = d.datasets[0].data[t.index]; var l = d.labels[t.index];
        return l + ': ' + (isCount ? fmtCountV(v) : fmtMoneyFull(v));
      } } }
    }
  });
  _charts.push(c);
}

function lineChart(grid, title, labels, datasets, isCount) {
  if (labels.length < 2 || !datasets.length) return;
  var cv = addCard(grid, title, 300, true);
  var fmtAxis = function(v) { return isCount ? fmtCountV(v) : fmtMoneyShort(v); };
  var c = new Chart(cv.getContext('2d'), {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false, spanGaps: true,
      legend: { display: datasets.length > 1, position: 'bottom', labels: { boxWidth: 12, fontSize: 10 } },
      scales: {
        xAxes: [{ gridLines: { display: false }, ticks: { fontSize: 10, maxTicksLimit: 14 } }],
        yAxes: [{ ticks: { beginAtZero: true, callback: fmtAxis, maxTicksLimit: 6 }, gridLines: { color: '#f0f0f0' } }]
      },
      tooltips: { mode: 'index', intersect: false, callbacks: { label: function(t, d) {
        var name = d.datasets[t.datasetIndex].label || '';
        var v = t.yLabel;
        return (name ? name + ': ' : '') + (isCount ? fmtCountV(v) : fmtMoneyFull(v));
      } } }
    }
  });
  _charts.push(c);
}

function buildCharts(grid, parsed, label) {
  if (!window.Chart) return;
  var rawHeaders = parsed.headers || [];
  var rows = parsed.rows || [];
  if (!rawHeaders.length || !rows.length) return;
  var firstH = rawHeaders[0];
  var numHs = numericHeaders(rawHeaders, rows);
  if (!numHs.length) return;

  if (label === 'Hourly Sales') {
    var rs = chartDataRows(rows, firstH);
    var labels = [];
    for (var i = 0; i < rs.length; i++) { labels.push(trunc(rs[i][firstH].v, 8)); }
    var use = numHs.slice(0, 4);
    var datasets = [];
    for (var d = 0; d < use.length; d++) {
      var vals = [];
      for (var r = 0; r < rs.length; r++) {
        var cell = rs[r][use[d]];
        vals.push(cell && typeof cell.v === 'number' ? cell.v : null);
      }
      datasets.push({
        label: trunc(use[d], 22), data: vals,
        borderColor: PAL[d % PAL.length],
        backgroundColor: d === 0 ? 'rgba(228,30,38,0.08)' : 'rgba(0,0,0,0)',
        fill: d === 0, pointRadius: 2, pointBackgroundColor: PAL[d % PAL.length],
        lineTension: 0.3, borderWidth: 2
      });
    }
    var isC0 = isCountField(use[0], '');
    lineChart(grid, 'Sales by Hour', labels, datasets, isC0);
    return;
  }

  var valH = pickValueHeader(numHs);
  if (!valH) return;
  var rs2 = chartDataRows(rows, firstH);
  var pts = pointsFrom(rs2, firstH, valH);
  var isC = isCountField(valH, '');
  barChart(grid, trunc(valH, 26) + ' \u2014 Top 12', pts, isC);
  if (label.indexOf('Top ') !== 0) {
    doughnutChart(grid, 'Share of ' + trunc(valH, 22), pts, isC);
  }
}
/* ---------- END CHART LAYER ---------- */

function buildReportNav() {
  var nav = document.getElementById('reportNav');
  nav.innerHTML = '';
  REPORTS.forEach(function(r, i) {
    var tab = document.createElement('div');
    tab.className = 'rnav-tab' + (i === activeReport ? ' active' : '');
    tab.textContent = r.label;
    tab.onclick = (function(idx) {
      return function() {
        activeReport = idx;
        buildReportNav();
        loadReport(idx);
      };
    })(i);
    nav.appendChild(tab);
  });
}

function loadReport(idx) {
  var report = REPORTS[idx];
  destroyCharts();
  setStatus('loading', 'Loading ' + report.label + '...');
  document.getElementById('content').innerHTML = '<div class="loading-msg">Loading...</div>';
  document.getElementById('storeBar').innerHTML = '';

  if (cache[report.file]) {
    renderReport(cache[report.file]);
    return;
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', BASE_URL + report.file + '?_=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        cache[report.file] = data;
        renderReport(data);
      } catch(e) {
        setStatus('err', 'Parse error');
        showError('Could not parse ' + report.file);
      }
    } else {
      setStatus('err', 'Not found (run the scraper first)');
      showError(report.label + ' data not found. Run the scraper first.');
    }
  };
  xhr.send();
}

function renderReport(data) {
  var dates = Object.keys(data).sort();
  if (!dates.length) { showError('No data found.'); return; }
  activeDate = dates[dates.length - 1];

  var dateStores = data[activeDate] || {};
  var available = STORE_ORDER.filter(function(s) { return dateStores[s]; });
  if (!available.length) { showError('No store data for latest date.'); return; }

  if (_userRole !== 'admin' && _userStoreName) {
    available = available.filter(function(s) { return s === _userStoreName; });
    document.getElementById('storeBar').style.display = 'none';
  }

  if (!available.length) { showError('No data available for your store.'); return; }
  if (available.indexOf(activeStore) === -1) activeStore = available[0];

  buildStoreBar(available, dateStores);
  renderTable(dateStores[activeStore]);

  var report = REPORTS[activeReport];
  document.getElementById('headerMeta').textContent = report.label + ' \u00B7 ' + activeDate + (_userRole !== 'admin' && _userStoreName ? ' \u00B7 ' + _userStoreName : '');
  setStatus('ok', 'Data loaded \u00B7 updates daily at 5 AM');
}

function buildStoreBar(stores, dateStores) {
  var bar = document.getElementById('storeBar');
  bar.innerHTML = '';
  stores.forEach(function(store) {
    var tab = document.createElement('div');
    tab.className = 'store-tab' + (store === activeStore ? ' active' : '');
    tab.textContent = store;
    tab.onclick = (function(s, ds) {
      return function() {
        activeStore = s;
        buildStoreBar(stores, ds);
        renderTable(ds[s]);
      };
    })(store, dateStores);
    bar.appendChild(tab);
  });
}

// FIX: deduplicate headers — if two columns have the same name, append _2, _3 etc
function dedupeHeaders(headers) {
  var seen = {};
  return headers.map(function(h) {
    if (!h) return h;
    if (!seen[h]) {
      seen[h] = 1;
      return h;
    } else {
      seen[h]++;
      return h + ' _' + seen[h];
    }
  });
}

// FIX: check if a value should be formatted as a count rather than currency
// checks both the column header AND the row label (first column value)
function isCountField(colHeader, rowLabel) {
  var combined = ((colHeader || '') + ' ' + (rowLabel || '')).toLowerCase();
  return combined.indexOf('qty') !== -1 ||
         combined.indexOf('count') !== -1 ||
         combined.indexOf('units') !== -1;
}

function renderTable(storeData) {
  destroyCharts();
  var content = document.getElementById('content');
  if (!storeData) { showError('No data for this store.'); return; }
  if (storeData.error) { showError('Scrape error: ' + esc(storeData.error)); return; }

  var parsed = storeData.data || {};
  var rawHeaders = parsed.headers || [];
  var rows = parsed.rows || [];

  if (!rows.length) { showError('No rows in data. Run the scraper first.'); return; }

  // Deduplicate headers for display and lookup
  var headers = dedupeHeaders(rawHeaders);

  var wrap = document.createElement('div');
  wrap.className = 'table-wrap';

  var table = document.createElement('table');
  table.className = 'report-table';

  // Header row
  var thead = document.createElement('thead');
  var htr = document.createElement('tr');
  headers.forEach(function(h) {
    var th = document.createElement('th');
    // Strip the dedup suffix for display
    th.textContent = (h || '').replace(/ _\d+$/, '');
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);

  // Body
  var tbody = document.createElement('tbody');
  rows.forEach(function(row) {
    var tr = document.createElement('tr');

    // Get row label from first raw header for total-row detection
    var firstCell = row[rawHeaders[0]];
    var firstVal = firstCell ? firstCell.v : null;
    if (firstVal && String(firstVal).toLowerCase().indexOf('total') !== -1) {
      tr.className = 'total-row';
    }

    // Get row label text for count detection
    var rowLabel = firstVal ? String(firstVal) : '';

    headers.forEach(function(h, colIdx) {
      var td = document.createElement('td');
      // Look up by original header name (before dedup) for first occurrence,
      // or deduped name — rows are keyed by original header so use rawHeaders
      var rawH = rawHeaders[colIdx] || h;
      var cell = row[rawH] || {v: null, t: 'nil'};
      var v = cell.v;
      var t = cell.t;

      if (v === null || v === undefined) {
        td.className = 'val-nil';
        td.textContent = '-';
      } else if (t === 'str') {
        td.textContent = v;
        td.className = 'val-neutral';
      } else if (t === 'pct') {
        td.textContent = (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
        td.className = v < 0 ? 'val-negative' : 'val-positive';
      } else if (t === 'num') {
        // FIX: check both column header and row label for count/qty keywords
        if (isCountField(h, colIdx === 0 ? '' : rowLabel)) {
          td.textContent = Math.round(v).toLocaleString();
        } else {
          td.textContent = (v < 0 ? '-' : '') + '\u20AC' + Math.abs(v).toLocaleString('en-IE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        td.className = v < 0 ? 'val-negative' : (v > 0 ? 'val-positive' : 'val-neutral');
      } else {
        td.textContent = v;
        td.className = 'val-neutral';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  content.innerHTML = '';

  var chartGrid = document.createElement('div');
  chartGrid.className = 'chart-grid';
  try { buildCharts(chartGrid, parsed, REPORTS[activeReport].label); } catch(e) {}
  if (chartGrid.children.length) content.appendChild(chartGrid);

  content.appendChild(wrap);
  if (storeData.scraped_at) {
    var meta = document.createElement('p');
    meta.style.cssText = 'text-align:right;font-size:.72rem;color:#aaa;margin-top:12px;';
    meta.textContent = 'Scraped: ' + storeData.scraped_at.replace('T',' ').substring(0,19);
    content.appendChild(meta);
  }
}

function setStatus(type, msg) {
  var dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + type;
  document.getElementById('statusText').textContent = msg;
}

function showError(msg) {
  destroyCharts();
  document.getElementById('content').innerHTML = '<div class="error-msg">' + esc(msg) + '</div>';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

buildReportNav();
loadReport(0);
</script>
</body>
</html>
