<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Big Night Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;700;800&display=swap">
<style>
/* Layout: pass-the-phone trivia. Setup (teams, decks, style) → game screen: team pies strip, tilted 3D spinning wheel, question card, result → winner. Shares the Games Press look: ink navy, brushed gold, muted jewel tones. */
:root{
  --bg:#0b0f17; --s1:#121a27; --s2:#192335; --line:#26314a; --text:#e8edf5; --muted:#8d99ae; --gold:#d6b26e; --gold-2:#b8914c; --good:#6fbf9a; --bad:#e0705f;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{--tc:var(--pc,#8a8a8a)}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(1100px 520px at 50% -12%,rgba(214,178,110,.10),transparent 62%);background-repeat:no-repeat;color:var(--text);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{box-sizing:border-box;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.04em;font-size:clamp(44px,13vw,76px);line-height:.92;margin:0}
h1 span{color:var(--gold)}
h2{font-family:var(--display);font-weight:700;letter-spacing:-.03em;font-size:clamp(24px,7vw,34px);line-height:1.05;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:10px 0 0;max-width:48ch}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}
.back{color:var(--muted);font-weight:700;text-decoration:none;font-size:14px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 22px 44px -30px rgba(0,0,0,.8)}
.go{background:linear-gradient(180deg,#e6cb93,#c39b52);color:#17110a;font-family:var(--display);font-weight:600;font-size:19px;padding:15px;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 26px -12px rgba(214,178,110,.7);transition:transform .12s,filter .12s}
.go:hover{filter:brightness(1.05)}.go:active{transform:translateY(1px) scale(.99)}
.go:disabled{filter:grayscale(.7);opacity:.45;transform:none}
.alt{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:700}
.alt:hover{background:rgba(255,255,255,.07)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;padding:11px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#17110a}
.err{color:#f0a493;font-weight:700;margin:0;min-height:1.2em}
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--s1);border:1px solid rgba(255,255,255,.06);border-left:4px solid var(--pc);border-radius:12px;padding:10px}
.tcard input{min-width:0;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 2px;font-weight:700;font-size:17px}
.tcard .dot{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.tcard .x{width:36px;height:36px;border-radius:9px;color:var(--muted);font-size:20px}
.chars{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;min-width:0}
.chars button{flex:none;width:52px;height:52px;border-radius:12px;background:var(--s2);padding:3px;border:1px solid transparent;box-sizing:border-box}
.chars button[aria-pressed="true"]{border-color:var(--pc);background:#22304a}
svg.ch{display:block;width:100%;height:100%;overflow:visible}
.add{align-self:flex-start;color:var(--gold);font-weight:800;padding:4px 0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--gold)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.deck{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:12px;background:var(--s1);border:1px solid rgba(255,255,255,.06);font-weight:700;font-size:14px;transition:border-color .15s,background .15s}
.deck i{width:14px;height:14px;border-radius:4px;background:var(--dc);flex:none;opacity:.45}
.deck[aria-pressed="true"]{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,var(--s1))}
.deck[aria-pressed="true"] i{opacity:1;box-shadow:0 0 10px var(--dc)}
.deck small{display:block;color:var(--muted);font-weight:600;font-size:12px}
/* game */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.team{display:grid;grid-template-columns:44px minmax(0,1fr) 46px;gap:8px;align-items:center;background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:6px 8px;transition:border-color .2s,box-shadow .2s}
.team.up{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 10px 24px -16px var(--pc)}
.team .av{width:44px;height:44px}
.team.up .av{animation:bob 1.2s ease-in-out infinite}
.team .nm{font-weight:800;font-size:14px;overflow-wrap:anywhere;line-height:1.1}
.team .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.pie{width:46px;height:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.pie path.on{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-8%)}}
.stage{perspective:900px;display:flex;justify-content:center;padding:6px 0 10px}
.tilt{position:relative;width:min(78vw,330px);aspect-ratio:1;transform:rotateX(24deg);transform-style:preserve-3d}
.wheel{position:absolute;inset:0;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.75,.12,1);
  box-shadow:0 0 0 6px #1a2335,0 0 0 8px #d6b26e55,0 14px 0 4px #0a0f1a,0 30px 40px rgba(0,0,0,.6)}
.wheel .seg-lbl{position:absolute;left:50%;top:50%;width:46%;height:0;transform-origin:0 0;display:flex;align-items:center;justify-content:flex-end;padding-right:7%;box-sizing:border-box}
.wheel .seg-lbl span{font-family:var(--display);font-weight:700;font-size:clamp(9px,2.8vw,13px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
.wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),transparent 45%),radial-gradient(circle at 50% 50%,transparent 60%,rgba(0,0,0,.35));pointer-events:none}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3dfae,#b98d43 70%);box-shadow:0 4px 0 #6f5320,0 8px 16px rgba(0,0,0,.5);z-index:2}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--gold);filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));z-index:3}
.cat{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;min-height:30px;text-align:center}
.cat i{width:14px;height:14px;border-radius:4px;background:var(--dc)}
.qcard{background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 16%,#151d2c),#0d131f 70%);border:1px solid color-mix(in srgb,var(--dc) 40%,transparent);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -34px rgba(0,0,0,.95);animation:deal .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes deal{0%{transform:translateY(24px) rotateX(18deg);opacity:0}100%{transform:none;opacity:1}}
.qcard .kind{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--dc)}
.qcard .kind span:last-child{color:var(--muted);letter-spacing:.04em;text-transform:none}
.qcard .q{font-family:var(--display);font-weight:600;font-size:clamp(21px,5.8vw,28px);line-height:1.22;letter-spacing:-.015em;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-weight:700;font-size:16px;display:flex;gap:12px;align-items:center;transition:background .15s,border-color .15s,transform .1s}
.opt b{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--s2);font-size:13px;color:var(--muted);flex:none}
.opt:hover{background:rgba(255,255,255,.07)}
.opt.right{background:color-mix(in srgb,var(--good) 25%,transparent);border-color:var(--good)}
.opt.right b{background:var(--good);color:#0b0f17}
.opt.wrong{background:color-mix(in srgb,var(--bad) 22%,transparent);border-color:var(--bad)}
.opt.wrong b{background:var(--bad);color:#0b0f17}
.opt.dim{opacity:.45}
.reveal{background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;color:var(--good)}
.tbar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.tbar div{height:100%;background:linear-gradient(90deg,var(--gold-2),#ecd29e);transform-origin:left;transition:transform 1s linear}
.verdict{font-family:var(--display);font-weight:700;font-size:26px;text-align:center}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.minor{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--muted)}
.minor button{color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--dc)}
.winner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.winner .av{width:160px;height:160px;animation:bob 1s ease-in-out infinite}
.winner h1{color:var(--pc)}
.stand{list-style:none;margin:0;padding:0}
.stand li{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.stand li .mini{width:34px;height:34px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.obar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.obar .alt{padding:7px 12px}
.onote{text-align:center;color:var(--muted);margin:0}.onames{text-align:center;color:var(--muted);font-weight:700;margin-top:-6px}
.watching{opacity:.55;cursor:default}
.oteam{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--x-line);background:rgba(255,255,255,.03);color:var(--x-text);font:inherit;cursor:pointer;margin-top:8px}
.oteam[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent)}
.oteam .av svg{width:52px;height:52px}.oteam b{display:block}.oteam small{color:var(--muted)}.oteam em{font-style:normal;font-weight:800;font-size:13px;color:var(--pc)}

/* board race */
.bstage{perspective:1000px;display:flex;justify-content:center;padding:4px 0 2px}
.btilt{width:min(100%,420px);transform:rotateX(26deg);transform-style:preserve-3d;transform-origin:50% 60%}
.bgrid{position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:5px;padding:8px;border-radius:18px;
  background:linear-gradient(160deg,#1a2335,#0e141f);box-shadow:0 30px 50px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08),0 10px 0 #070a10}
.bsq{aspect-ratio:1;border-radius:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 88%,#fff 12%),color-mix(in srgb,var(--dc) 70%,#000));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 color-mix(in srgb,var(--dc) 45%,#000);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;color:#0b0f17;min-width:0;overflow:hidden}
.bsq b{font:700 12px var(--display);line-height:1}.bsq span{font-size:9px;font-weight:800;line-height:1.05;overflow-wrap:anywhere;opacity:.85}
.bsq.st,.bsq.fin{--dc:#d6b26e;justify-content:center;align-items:center}.bsq.st b,.bsq.fin b{font-size:11px}
.bsq.fin{background:repeating-conic-gradient(#e8edf5 0 25%,#1a2335 0 50%) 0 0/14px 14px;box-shadow:0 4px 0 #070a10,0 0 0 2px #d6b26e}.bsq.fin b{background:#d6b26e;padding:3px 5px;border-radius:6px}
.bsq.tg{outline:3px solid #fff;outline-offset:1px;animation:tgp 1s ease-in-out infinite}
@keyframes tgp{50%{outline-color:rgba(255,255,255,.3)}}
.bpcs{position:absolute;inset:8px;pointer-events:none}
.bpc{position:absolute;width:var(--pw,13%);aspect-ratio:3/4;transform:translate(-50%,-78%) rotateX(-26deg);transform-origin:50% 100%;transition:left .26s ease,top .26s ease;filter:drop-shadow(0 6px 4px rgba(0,0,0,.55));z-index:2}
.bpc svg{width:100%;height:100%}.bpc.up{z-index:3}
.bpc.hop{animation:hop .26s ease}
@keyframes hop{50%{margin-top:-14px}}
.broll{display:flex;align-items:center;justify-content:center;gap:14px}
.broll .cat{text-align:left;max-width:30ch}
.die2{width:52px;height:52px;flex:none;border-radius:12px;background:linear-gradient(145deg,#fdfcf9,#d6d1c6);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-sizing:border-box;box-shadow:0 8px 16px -6px rgba(0,0,0,.7),inset 0 -3px 6px rgba(0,0,0,.15)}
.die2 i{border-radius:50%;margin:2px}.die2 i.on{background:radial-gradient(circle at 35% 35%,#465069,#0b0f17)}
.die2.rolling{animation:wob .14s linear infinite}@keyframes wob{50%{transform:rotate(14deg) scale(1.05)}}
.tprog{width:10px;height:40px;border-radius:6px;background:#1c2638;display:flex;align-items:flex-end;overflow:hidden;justify-self:center}.tprog i{display:block;width:100%;background:var(--pc);border-radius:6px}
.tscore{font:700 26px var(--display);color:var(--pc);text-align:center;font-variant-numeric:tabular-nums}
.team{grid-template-columns:44px minmax(0,1fr) 46px}
/* keep score */
.scard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 18px;border-radius:20px;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--dc) 35%,#141c2b),#0e141f 75%);border:1px solid rgba(255,255,255,.07);box-shadow:0 26px 50px -30px rgba(0,0,0,.95)}
.scard h2{color:var(--pc);margin:0;font-size:clamp(30px,8vw,44px)}
.sdeck{display:inline-flex;align-items:center;gap:10px;font:700 20px var(--display);padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.06)}
.sdeck i{width:14px;height:14px;border-radius:4px;background:var(--dc)}
body.has-video .btilt{transform:rotateX(18deg)}
.bsq.star{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 color-mix(in srgb,var(--dc) 45%,#000),0 0 0 2px #d6b26e}
.bsq em{font-style:normal;color:#fff;text-shadow:0 0 6px #d6b26e,0 1px 2px #000}
.cat.starq b{color:#d6b26e}
.bsq b{font-size:13px}.bsq span{font-size:10px}
.bwheel{display:flex;flex-direction:column;gap:16px}.bwheel .tilt{width:min(62vw,250px)}
.bnote{margin:0;text-align:center;color:var(--muted);font-weight:700}.bnote.starq b{color:#d6b26e}
.bsq .sst{font-size:18px;color:#fff;text-shadow:0 0 8px #fff8,0 1px 2px #000;align-self:center}
.bsq{color:#0b0f17}
</style>
</head>
<body>


<main id="app"></main>
<canvas id="confetti" hidden></canvas>

<script>window.HB_ONLINE=window.HB_ONLINE||null;</script>
<script src="online-config.js"></script>
<script>
/* ===== Games Press online layer: rooms (Supabase) + live video (WebRTC) ===== */
(function(){
const CFG=window.HB_ONLINE||null;
const ready=()=>!!(CFG&&CFG.url&&CFG.key);
const LS=k=>"po_"+k;
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS(k));return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(LS(k),JSON.stringify(v))}catch(e){}};
let myId=lsGet("me",null); if(!myId){myId=Math.random().toString(36).slice(2,10)+Date.now().toString(36);lsSet("me",myId)}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let SB=null;
function sb(){
  if(SB)return Promise.resolve(SB);
  if(!ready())return Promise.reject(new Error("Online play isn't set up on this site yet."));
  return new Promise((res,rej)=>{const go=()=>{SB=window.supabase.createClient(CFG.url,CFG.key,{realtime:{params:{eventsPerSecond:30}}});res(SB)};
    if(window.supabase)return go();
    const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
    s.onload=go;s.onerror=()=>rej(new Error("Couldn't reach the online service. Check your connection."));document.head.appendChild(s)});
}
let toastT;
function toast(m){let t=document.getElementById("po-toast");if(!t){t=document.createElement("div");t.id="po-toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}

/* ---------- styles ---------- */
const CSS=`
#po-toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:rgba(18,26,39,.95);color:#f2f4f8;border:1px solid rgba(214,178,110,.55);padding:10px 16px;border-radius:12px;font:700 14px/1.3 "Manrope",system-ui,sans-serif;max-width:calc(100% - 32px);text-align:center;box-shadow:0 18px 40px -16px rgba(0,0,0,.8)}
.po-net{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:85;background:#5a1f24;color:#fff;font:700 13px "Manrope",system-ui,sans-serif;padding:8px 14px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.po-panel{display:flex;flex-direction:column;gap:10px}
.po-row{display:flex;gap:8px;flex-wrap:wrap}.po-row>*{flex:1;min-width:120px}
.po-in{background:rgba(255,255,255,.04);border:1px solid #26314a;border-radius:10px;padding:11px 12px;font:700 16px "Manrope",system-ui,sans-serif;color:inherit;min-width:0;box-sizing:border-box;width:100%}
.po-code{font:700 clamp(40px,13vw,64px) "Sora","Manrope",system-ui,sans-serif;letter-spacing:.14em;color:#d6b26e;line-height:1;text-align:center}
.po-share{display:flex;gap:8px}.po-share input{flex:1;min-width:0}
.po-share button{padding:10px 14px;border-radius:10px;background:#26314a;font-weight:800;color:#e8edf5;border:0}
.po-plist{display:flex;flex-direction:column}
.po-p{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-weight:800}
.po-p small{margin-left:auto;color:#8d99ae;font-weight:600;font-size:13px}
.po-p i{width:10px;height:10px;border-radius:50%;background:var(--c,#6fbf9a);flex:none}

let netEl=null;
function netBanner(down){injectCSS();if(down){if(!netEl){netEl=document.createElement("div");netEl.className="po-net";document.body.appendChild(netEl)}netEl.textContent="Connection lost. Reconnecting…";netEl.hidden=false}else if(netEl)netEl.hidden=true}

/* ---------- rooms ---------- */
const rooms=new Set();
function Room(game){this.game=game;this.code=null;this.state=null;this.ver=0;this.handlers=[];this.chan=null;this.queue=Promise.resolve();rooms.add(this)}
Room.prototype.create=async function(state){
  await sb(); const A="ABCDEFGHJKLMNPQRSTUVWXYZ";
  for(let t=0;t<6;t++){let code="";for(let i=0;i<5;i++)code+=A[Math.floor(Math.random()*A.length)];
    state.game=this.game; state.host=state.host||myId;
    const {error}=await SB.from("hb_rooms").insert({code,state,ver:1});
    if(!error){this.code=code;this.state=state;this.ver=1;this._sub();lsSet("room_"+this.game,code);this._emit(null,false);return code}}
  throw new Error("Couldn't create a room. Check your connection and try again.");
};
Room.prototype.join=async function(code){
  await sb(); code=String(code||"").trim().toUpperCase();
  const {data,error}=await SB.from("hb_rooms").select("state,ver").eq("code",code).maybeSingle();
  if(error)throw new Error("Couldn't reach the online service. Check your connection.");
  if(!data)throw new Error("There's no room with that code.");
  if(data.state&&data.state.game&&data.state.game!==this.game)throw new Error("That code belongs to a different game.");
  this.code=code;this.state=data.state;this.ver=data.ver;this._sub();lsSet("room_"+this.game,code);this._emit(null,true);return this.state;
};
Room.prototype._sub=function(){
  if(this.chan)SB.removeChannel(this.chan);
  this.chan=SB.channel("room_"+this.code).on("postgres_changes",{event:"UPDATE",schema:"public",table:"hb_rooms",filter:"code=eq."+this.code},pl=>{
    if(!pl.new||pl.new.ver<=this.ver)return; const old=this.state; this.state=pl.new.state; this.ver=pl.new.ver; this._emit(old,true);
  }).subscribe(st=>{ if(st==="SUBSCRIBED"){netBanner(false);if(this._down){this._down=false;this.refresh()}} else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){this._down=true;netBanner(true);setTimeout(()=>{if(this._down&&this.code)this._sub()},3000)} });
};
Room.prototype.refresh=async function(){
  if(!this.code||!SB)return;
  try{const {data}=await SB.from("hb_rooms").select("state,ver").eq("code",this.code).maybeSingle();
    if(data&&data.ver>this.ver){const old=this.state;this.state=data.state;this.ver=data.ver;this._emit(old,true)}}catch(e){}
};
Room.prototype.on=function(fn){this.handlers.push(fn)};
Room.prototype._emit=function(old,remote){this.handlers.forEach(h=>{try{h(this.state,old,remote)}catch(e){console.error(e)}})};
/* update(mut): mut gets a fresh copy of the state to change. Retries on conflicts so simultaneous moves (votes, answers) both land. */
Room.prototype.update=function(mut){
  const run=async(tries)=>{
    const base=this.state, prev=this.ver, next=JSON.parse(JSON.stringify(base));
    if(mut(next)===false)return false;
    this.state=next; this.ver=prev+1; this._emit(base,false);
    let res;
    try{res=await SB.from("hb_rooms").update({state:next,ver:prev+1,updated_at:new Date().toISOString()}).eq("code",this.code).eq("ver",prev).select("ver")}catch(e){res={error:e}}
    if(res.error||!res.data||!res.data.length){
      if(this.ver===prev+1&&this.state===next){this.state=base;this.ver=prev}
      let data=null;try{data=(await SB.from("hb_rooms").select("state,ver").eq("code",this.code).maybeSingle()).data}catch(e){}
      if(data&&data.ver>=this.ver){const o=this.state;this.state=data.state;this.ver=data.ver;this._emit(o,true)}
      if(tries<4)return run(tries+1);
      toast("Couldn't save that move. Check your connection.");return false;
    }
    return true;
  };
  this.queue=this.queue.then(()=>run(0)).catch(e=>{console.error(e);toast("Connection problem. Trying again…");setTimeout(()=>this.refresh(),1500)});
  return this.queue;
};
Room.prototype.leave=function(){if(this.chan&&SB)SB.removeChannel(this.chan);this.chan=null;lsSet("room_"+this.game,null);this.code=null;this.state=null;this.ver=0;if(Video.on)Video.stop()};
Room.prototype.me=function(){return this.state&&this.state.players?this.state.players.find(p=>p.id===myId):null};
Room.prototype.isHost=function(){return !!(this.state&&this.state.host===myId)};
Room.prototype.saved=function(){return lsGet("room_"+this.game,null)};
Room.prototype.link=function(){return location.origin+location.pathname+"#"+this.code};
/* add me as a player (in the lobby); extra fields merged in */
Room.prototype.addMe=function(name,extra){
  return this.update(s=>{s.players=s.players||[];if(s.players.some(p=>p.id===myId))return false;
    let n=String(name||"").trim().slice(0,16)||"Player",base=n,k=2;const taken=s.players.map(p=>p.name.toLowerCase());while(taken.includes(n.toLowerCase()))n=base+" "+k++;
    s.players.push(Object.assign({id:myId,name:n},extra||{}));});
};

/* ---------- live video ---------- */
const Video={on:false,local:null,peers:{},chan:null,code:null,name:"",ice:null,el:null,mic:true,cam:true,_q:{}};
async function iceServers(){
  const list=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}];
  if(CFG&&CFG.relayUrl){try{const r=await fetch(CFG.relayUrl);const j=await r.json();if(Array.isArray(j))list.push(...j)}catch(e){}}
  if(CFG&&Array.isArray(CFG.iceServers))list.push(...CFG.iceServers);
  return list;
}
Video.start=async function(code,name){
  if(this.on)return; injectCSS(); await sb();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("This browser can't do video calls. Try Chrome or Safari.");
  const AUD={echoCancellation:true,noiseSuppression:true,autoGainControl:true}; let camOk=true;
  try{this.local=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:"user"},audio:AUD})}
  catch(e){ if(e&&e.name==="NotAllowedError")throw new Error("Camera and microphone are blocked. Allow them for this site in your browser settings, then try again.");
    try{this.local=await navigator.mediaDevices.getUserMedia({audio:AUD});camOk=false;toast("No camera found. You're on voice only.")}catch(e2){throw new Error("Couldn't start your microphone.")} }
  this.ice=await iceServers(); this.code=code; this.name=name; this.on=true; this.mic=true; this.cam=camOk;
  this._ui(); this._split(true); this._tile(myId,name,this.local,true); if(!camOk){const t=this.el.querySelector(`[data-id="${myId}"]`);if(t)t.classList.add("off");const cb=this.el.querySelector('[data-a="cam"]');if(cb){cb.classList.add("off");cb.disabled=true}}
  this._levels();
  this.chan=SB.channel("vid_"+code,{config:{broadcast:{self:false}}});
  this.chan.on("broadcast",{event:"sig"},m=>this._sig(m.payload)).subscribe(st=>{if(st==="SUBSCRIBED")this._send({t:"hello",from:myId,name:this.name})});
  this._iv=setInterval(()=>this._checkAll(),8000);
  document.body.classList.add("has-video"); Video._fire();
};
Video.stop=function(){
  if(!this.on)return; this._send({t:"bye",from:myId});
  Object.keys(this.peers).forEach(id=>this._drop(id));
  if(this.local)this.local.getTracks().forEach(t=>t.stop());
  if(this.chan&&SB)SB.removeChannel(this.chan); clearInterval(this._iv);
  this.chan=null;this.local=null;this.on=false; if(this.el)this.el.remove(); this.el=null; this._split(false); clearInterval(this._lv); try{this._ac&&this._ac.close()}catch(e){} this._ac=null;
  document.body.classList.remove("has-video","vmin"); Video._fire();
};
Video.toggle=async function(code,name){ if(this.on)return this.stop(); try{await this.start(code,name)}catch(e){toast(e.message||String(e))} };
Video._listeners=[]; Video.onChange=fn=>Video._listeners.push(fn); Video._fire=()=>Video._listeners.forEach(f=>{try{f(Video.on)}catch(e){}});
Video._send=function(p){if(!this.chan)return;try{const r=this.chan.send({type:"broadcast",event:"sig",payload:p});if(r&&r.catch)r.catch(()=>{})}catch(e){}};
Video._peer=function(id,name){
  let P=this.peers[id]; if(P){if(name)P.name=name;return P}
  const pc=new RTCPeerConnection({iceServers:this.ice});
  P=this.peers[id]={pc,name:name||"Friend",q:[],stream:null,making:false};
  this.local.getTracks().forEach(t=>pc.addTrack(t,this.local));
  pc.onicecandidate=e=>{if(e.candidate)this._send({t:"ice",from:myId,to:id,c:e.candidate.toJSON?e.candidate.toJSON():e.candidate})};
  pc.ontrack=e=>{P.stream=e.streams[0]||new MediaStream([e.track]);this._tile(id,P.name,P.stream,false)};
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;this._status(id,s==="connected"?"":s==="failed"?"Reconnecting…":s==="disconnected"?"Reconnecting…":"Connecting…");
    if(s==="failed")this._restart(id); if(s==="disconnected")setTimeout(()=>{if(pc.connectionState==="disconnected")this._restart(id)},4000)};
  this._tile(id,P.name,null,false); this._status(id,"Connecting…");
  return P;
};
Video._offer=async function(id,restart){
  const P=this.peers[id]; if(!P||P.making)return; P.making=true;
  try{const o=await P.pc.createOffer({iceRestart:!!restart});await P.pc.setLocalDescription(o);this._send({t:"offer",from:myId,to:id,name:this.name,sdp:P.pc.localDescription})}catch(e){}
  P.making=false;
};
Video._restart=function(id){ if(myId<id)this._offer(id,true); else this._send({t:"restart",from:myId,to:id}) };
Video._reconnectAll=function(){this._send({t:"hello",from:myId,name:this.name});Object.keys(this.peers).forEach(id=>this._restart(id))};
Video._checkAll=function(){Object.keys(this.peers).forEach(id=>{const s=this.peers[id].pc.connectionState;if(s==="failed"||s==="disconnected")this._restart(id)})};
Video._sig=async function(p){
  if(!p||p.from===myId||(p.to&&p.to!==myId)||!this.on)return; const from=p.from;
  try{
    if(p.t==="hello"){const had=!!this.peers[from];this._send({t:"here",from:myId,to:from,name:this.name});if(had){this._drop(from)}this._peer(from,p.name);if(myId<from)this._offer(from);return}
    if(p.t==="here"){this._peer(from,p.name);if(myId<from)this._offer(from);return}
    if(p.t==="bye"){this._drop(from);return}
    if(p.t==="restart"){if(this.peers[from])this._offer(from,true);return}
    const P=this._peer(from,p.name),pc=P.pc;
    if(p.t==="offer"){await pc.setRemoteDescription(p.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);this._send({t:"answer",from:myId,to:from,sdp:pc.localDescription});this._flush(from)}
    else if(p.t==="answer"){if(pc.signalingState==="have-local-offer"){await pc.setRemoteDescription(p.sdp);this._flush(from)}}
    else if(p.t==="ice"){if(pc.remoteDescription&&pc.remoteDescription.type)await pc.addIceCandidate(p.c).catch(()=>{});else P.q.push(p.c)}
  }catch(e){console.warn("video signal",e)}
};
Video._flush=function(id){const P=this.peers[id];if(!P)return;const q=P.q.splice(0);q.forEach(c=>P.pc.addIceCandidate(c).catch(()=>{}))};
Video._drop=function(id){const P=this.peers[id];if(P){try{P.pc.close()}catch(e){}delete this.peers[id]}const t=this.el&&this.el.querySelector(`[data-id="${id}"]`);if(t)t.remove();this._count()};
Video._ui=function(){
  const el=document.createElement("div");el.className="vbar";el.setAttribute("role","region");el.setAttribute("aria-label","Video call");
  el.innerHTML=`<div class="vtiles"></div><div class="vctl"><button data-a="mic" title="Mute or unmute" aria-label="Microphone">🎤</button><button data-a="cam" title="Camera on or off" aria-label="Camera">📷</button><button data-a="min" title="Hide faces" aria-label="Hide or show faces">▾</button><button data-a="leave" class="red" title="Leave video" aria-label="Leave video">✕</button></div>`;
  el.querySelector(".vctl").onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;
    if(a==="mic"){this.mic=!this.mic;this.local.getAudioTracks().forEach(t=>t.enabled=this.mic);b.classList.toggle("off",!this.mic);b.textContent=this.mic?"🎤":"🔇"}
    if(a==="cam"){this.cam=!this.cam;this.local.getVideoTracks().forEach(t=>t.enabled=this.cam);b.classList.toggle("off",!this.cam);const me=el.querySelector(`[data-id="${myId}"]`);if(me)me.classList.toggle("off",!this.cam)}
    if(a==="min"){const m=document.body.classList.toggle("vmin");b.textContent=m?"▴":"▾";b.title=m?"Show faces":"Hide faces"}
    if(a==="leave")this.stop()};
  document.body.appendChild(el); this.el=el;
};
Video._tile=function(id,name,stream,me){
  if(!this.el)return; let t=this.el.querySelector(`[data-id="${id}"]`);
  if(!t){t=document.createElement("div");t.className="vt"+(me?" me":"");t.dataset.id=id;t.dataset.initial=(name||"?").trim().charAt(0).toUpperCase();
    t.innerHTML=`<video autoplay playsinline ${me?"muted":""}></video><span class="nm"></span><span class="st" hidden></span>`;
    const box=this.el.querySelector(".vtiles"); if(me)box.prepend(t); else box.appendChild(t)}
  t.querySelector(".nm").textContent=me?name+" (you)":name;
  if(stream){const v=t.querySelector("video");if(v.srcObject!==stream){v.srcObject=stream;this._play(v)}
    if(!me){const chk=()=>t.classList.toggle("off",!stream.getVideoTracks().some(x=>x.readyState==="live"&&!x.muted));chk();stream.onaddtrack=chk;stream.getVideoTracks().forEach(x=>{x.onmute=chk;x.onunmute=chk})}
    if(!me)this._watch(id,stream)}
  this._count();
};
/* phones block sound until a tap: offer a button that starts everyone's audio */
Video._play=function(v){const p=v.play();if(p&&p.catch)p.catch(()=>this._needTap())};

function startGame(){
  const names=cfg.teams.map((t,i)=>t.name.trim()||`${NAMES[i]} team`);
  if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){err="Two teams have the same name.";return renderSetup()}
  err=""; beep(1,.01);
  const game=cfg.game||"wheel";
  G={teams:cfg.teams.map((t,i)=>({name:names[i],char:t.char,color:COLORS[i],wedges:[],right:0,asked:0,pos:0,score:0})),decks:cfg.decks.slice(),mode:cfg.mode,timer:cfg.timer,level:cfg.level||"mixed",
     game,turn:0,used:{},phase:"spin",cur:null,rot:0,streak:0,roll:null,target:null,nRounds:cfg.rounds||3,rounds:(cfg.rounds||3)*PER_ROUND,roundNo:1,theme:cfg.theme||"deck"};
  if(game==="score"){G.needTopic=G.theme!=="mix";G.roundDeck=null}
  if(game==="board"){const N=BOARD_LEN[cfg.len]||30,sq=["start"];let bag=[];for(let i=1;i<N-1;i++){if(!bag.length)bag=shuffle(G.decks.slice());if(bag[0]===sq[i-1]&&bag.length>1)bag.push(bag.shift());sq.push(bag.shift())}sq.push("finish");G.squares=sq}
  G.nextDeck=pickDeck(); lastPos={};
  save(); render();
}

function pickDeck(prev){const d=G.decks;if(d.length===1)return d[0];let k;do{k=d[Math.floor(Math.random()*d.length)]}while(k===prev);return k}
const GAME=()=>G&&G.game||"wheel";
/* ---------- pieces ---------- */
function pieSVG(team){
  const n=G.decks.length, r=20;
  const pt=a=>[(Math.sin(a)*r).toFixed(2),(-Math.cos(a)*r).toFixed(2)];
  let out=`<svg class="pie" viewBox="-23 -23 46 46" aria-hidden="true"><circle r="22" fill="#0b0f17"/>`;
  G.decks.forEach((id,i)=>{const a1=i/n*Math.PI*2,a2=(i+1)/n*Math.PI*2,[x1,y1]=pt(a1),[x2,y2]=pt(a2),on=team.wedges.includes(id);
    out+=`<path class="${on?"on":""}" d="M0 0L${x1} ${y1}A${r} ${r} 0 ${a2-a1>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${on?deckById(id).c:"#1c2638"}" stroke="#0b0f17" stroke-width="1.2" style="transform-origin:0 0"/>`});
  return out+`<circle r="5" fill="#0b0f17"/><circle r="3.6" fill="#d6b26e"/></svg>`;
}
function teamsHTML(){
  const g=GAME(), N=G.squares?G.squares.length-1:0;
  return `<div class="teams">${G.teams.map((t,i)=>`<div class="team${i===G.turn?" up":""}" style="--pc:${t.color}"><span class="av">${chSVG(t.char)}</span><span class="nm">${esc(t.name)}<small>${g==="wheel"?`${t.wedges.length} of ${G.decks.length} slices`:g==="board"?(t.pos?`Square ${t.pos} of ${N}`:"On the start"):`Round ${G.roundNo||1} · ${Math.min(Math.max(0,t.asked-((G.roundNo||1)-1)*PER_ROUND),PER_ROUND)} of ${PER_ROUND}`}</small></span>${g==="wheel"?pieSVG(t):g==="board"?`<span class="tprog"><i style="height:${Math.round(t.pos/N*100)}%"></i></span>`:`<span class="tscore">${t.score||0}</span>`}</div>`).join("")}</div>`;
}
function wheelHTML(){
  const n=G.decks.length, seg=360/n;
  const grad=G.decks.map((id,i)=>`${deckById(id).c} ${i*seg}deg ${(i+1)*seg}deg`).join(",");
  const lbls=G.decks.map((id,i)=>`<div class="seg-lbl" style="transform:rotate(${(i+.5)*seg-90}deg)"><span>${esc(SHORT[id]||deckById(id).name)}</span></div>`).join("");

}

/* ---------- game flow ---------- */
function render(){
  clearInterval(tick);
  if(!G)return renderSetup();
  if(G.phase==="over")return renderOver();
  if(G.phase==="question"||G.phase==="result")return renderQuestion();
  if(GAME()==="board")return renderBoardTurn();
  if(G.phase==="roundEnd")return renderRoundEnd();
  if(GAME()==="score")return renderScoreTurn();
  const t=G.teams[G.turn];
  app.innerHTML=`<div class="wrap">
    ${teamsHTML()}
    <div style="text-align:center"><div class="label">Up next</div><h2 style="color:${t.color};margin-top:6px">${esc(t.name)}</h2></div>

    <button class="go" id="spin">Spin the wheel</button>
    <div class="legend">${G.decks.map(id=>`<span style="--dc:${deckById(id).c}"><i></i>${esc(deckById(id).name)}</span>`).join("")}</div>
    <div class="minor"><span></span><span><button id="skip">Skip team</button> · <button id="quit">End game</button></span></div>
  </div>`;
  $("spin").onclick=spin;
  $("skip").onclick=()=>{nextTeam()};
  $("quit").onclick=()=>{G.phase="over";G.ended=true;save();render()};
}
function spin(){
  if(spinning)return; spinning=true; beep(1,.01);
  const n=G.decks.length, seg=360/n, k=Math.floor(Math.random()*n);
  const centre=(k+.5)*seg+(Math.random()-.5)*seg*.6;
  const cur=((G.rot%360)+360)%360, want=(360-centre)%360;
  G.rot=G.rot+360*5+((want-cur+360)%360);
  const w=$("wheel"); $("spin").disabled=true; $("cat").textContent="…";
  w.style.transition=RM?"none":""; w.style.transform=`rotate(${G.rot}deg)`;
  if(!RM){let t=0,gap=40;const step=()=>{beep(900,.025,"square",.05);t+=gap;gap*=1.12;if(t<3900)setTimeout(step,gap)};step()}
  setTimeout(()=>{
    spinning=false; if(!$("cat")||G.phase!=="spin")return; const d=deckById(G.decks[k]);
    $("cat").innerHTML=`<i style="--dc:${d.c}"></i>${esc(d.name)}`; beep(660,.12,"triangle");buzz(30);
    setTimeout(()=>spinDone(d.id),RM?0:700);
  },RM?50:4300);
}
function spinDone(id){
  if(G.phase!=="spin")return; const g=GAME();
  if(g==="board"){const t=G.teams[G.turn],last=G.squares.length-1,nx=Math.min(t.pos+1,last),star=isStar(nx);G.star=star;G.target=Math.min(t.pos+(star?2:1),last);return ask(id,star)}
  if(g==="score"&&G.needTopic){G.needTopic=false;G.roundDeck=id;G.nextDeck=id;save();return render()}
  ask(id)
}
const wheelBlock=(msg,btn)=>`${wheelHTML()}<div class="cat" id="cat" aria-live="polite">${msg}</div><button class="go" id="spin">${btn}</button>`;
function ask(deckId,forceHard){
  const d=deckById(deckId), lv=G.level||"mixed", hard=d.h||[];
  const src=forceHard&&hard.length?hard:lv==="easy"?d.q:lv==="hard"?(hard.length?hard:d.q):d.q.concat(hard);
  G.used[deckId]=(G.used[deckId]||[]).filter(x=>typeof x==="string");
  let pool=src.filter(l=>!G.used[deckId].includes(l.split("|")[0]));
  if(!pool.length){G.used[deckId]=[];pool=src}
  const line=pool[Math.floor(Math.random()*pool.length)]; G.used[deckId].push(line.split("|")[0]);
  const parts=line.split("|");
  G.cur={deck:deckId,hard:hard.includes(line),q:parts[0],a:parts[1],opts:shuffle(parts.slice(1)),pick:null,shown:false,ok:null,ends:G.timer?Date.now()+G.timer*1000:0};
  G.phase="question"; G.teams[G.turn].asked++; save(); render();
}
function renderQuestion(){
  const t=G.teams[G.turn], c=G.cur, d=deckById(c.deck), done=G.phase==="result", has=done?!!c.hadWedge:t.wedges.includes(c.deck);
  let body="";

    body=`<div class="opts">${c.opts.map((o,i)=>{let cls="opt";if(done){if(o===c.a)cls+=" right";else if(o===c.pick)cls+=" wrong";else cls+=" dim"}
      return `<button class="${cls}" data-o="${i}" ${done?"disabled":""}><b>${"ABCD"[i]}</b><span>${esc(o)}</span></button>`}).join("")}</div>`;
  } else {
    body=c.shown||done?`<div class="reveal">${esc(c.a)}</div>${done?"":`<div class="seg"><button class="go" id="gotIt" style="flex:1">They got it</button><button class="alt" id="missed" style="flex:1">They missed it</button></div>`}`
      :`<button class="alt" id="show">Show the answer</button>`;
  }
  let foot="";
  if(done){
    const won=c.ok&&!c.hadWedge, g=GAME(), fin=G.squares&&G.target===G.squares.length-1;
    const msg=g==="board"?(c.ok?(fin?"Correct! Over the finish line":G.star?`Star answer! Jump 2 to square ${G.target}`:`Correct! Move to square ${G.target}`):`${c.timeout?"Time's up!":"Not this time."} Stay on ${t.pos?"square "+t.pos:"the start"}`)
      :g==="score"?(c.ok?`Correct! +${c.pts} point${c.pts>1?"s":""}`:(c.timeout?"Time's up! No points":"Not this time. No points"))
      :(c.ok?(won?`Correct! ${esc(d.name)} slice won`:"Correct!"):(c.timeout?"Time's up!":"Not this time"));

    foot=`<div class="verdict ${c.ok?"good":"bad"}">${msg}</div>
      ${G.winning?`<p class="lede" style="text-align:center">${g==="board"?"Winner!":"Full pie!"}</p>`:`<button class="go" id="next">${g==="wheel"&&c.ok&&G.phase!=="over"?`${esc(t.name)} spins again`:lastQ?"See the final scores":roundDone?`See the scores after round ${G.roundNo}`:"Next team"}</button>`}`;
  }
  app.innerHTML=`<div class="wrap">
    ${teamsHTML()}
    <div class="qcard" style="--dc:${d.c}">
      <div class="kind"><span>${esc(d.name)}${c.hard?" · Harder":""}</span><span>${esc(t.name)}${GAME()==="wheel"&&has?" · already has this slice":GAME()==="board"&&G.target!=null?` · ${G.star?"★ Star · ":""}for square ${G.target===G.squares.length-1?"Finish":G.target}`:GAME()==="score"?` · ${c.hard?"2 points":"1 point"}`:""}</span></div>
      ${G.timer&&!done?`<div class="tbar"><div id="tb"></div></div>`:""}
      <div class="q">${esc(c.q)}</div>
      ${body}
    </div>
    ${foot}
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=c.opts[+b.dataset.o];c.pick=o;finish(o===c.a)});

      ${host?'<button class="alt" id="oedit">Change teams or decks</button>':""}</div>
    ${host?`<button class="go" id="ostart">Start the quiz</button>`:`<p class="onote">Waiting for the host to start…</p>`}
  </div>`;
  oWireBar(); Online.wireShare(room);
  app.querySelectorAll(".oteam").forEach(b=>b.onclick=()=>{const i=+b.dataset.t;room.update(x=>{const p=x.players.find(p=>p.id===Online.myId);if(!p||p.team===i)return false;p.team=i})});
  if($("oedit"))$("oedit").onclick=()=>{editing=true;cfg=Object.assign({},cfg,clone(room.state.cfg));renderSetup()};
  if($("ostart"))$("ostart").onclick=()=>startGame();
}
// over screen buttons when online
{const o1=renderOver; renderOver=function(){ o1(); if(!ON)return;
  const a=$("again"),st=$("setup"); if(a&&room.isHost())a.onclick=()=>{cfg=clone(room.state.cfg);G=null;startGame()};
  if(st&&room.isHost())st.onclick=()=>room.update(s=>{s.phase="lobby";s.g=null}) }}
function onlineBoot(){ if(!Online.ready())return; const h=(location.hash||"").replace("#","").toUpperCase(), saved=Online.lsGet("room_quiz",null), code=/^[A-Z]{5}$/.test(h)?h:saved; if(!code)return;
  const r=new Online.Room("quiz"); r.join(code).then(()=>{ if(r.me()){room=r;ON=true;room.on(oOn);Online.setHash(room.code);oOn(room.state,null,true)} else if(h){ /* new visitor via link: name box is on the setup screen */ } else Online.lsSet("room_quiz",null)}).catch(()=>Online.lsSet("room_quiz",null)) }

renderSetup();
onlineBoot();
</script>
